<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markmap — Mapas Mentais</title>
    <meta name="description" content="Crie mapas mentais elegantes a partir de texto Markdown, de forma simples e rápida.">
    <meta name="theme-color" content="#a78bfa">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Markmap">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d0b14'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23a78bfa'/%3E%3Ccircle cx='6' cy='9' r='2' fill='%23a78bfa' opacity='.7'/%3E%3Ccircle cx='6' cy='23' r='2' fill='%23a78bfa' opacity='.7'/%3E%3Ccircle cx='26' cy='9' r='2' fill='%23c4b5fd' opacity='.6'/%3E%3Ccircle cx='26' cy='23' r='2' fill='%23c4b5fd' opacity='.6'/%3E%3Cline x1='13' y1='14' x2='8' y2='10' stroke='%23a78bfa' stroke-width='1.2' opacity='.6'/%3E%3Cline x1='13' y1='18' x2='8' y2='22' stroke='%23a78bfa' stroke-width='1.2' opacity='.6'/%3E%3Cline x1='19' y1='14' x2='24' y2='10' stroke='%23a78bfa' stroke-width='1.2' opacity='.6'/%3E%3Cline x1='19' y1='18' x2='24' y2='22' stroke='%23a78bfa' stroke-width='1.2' opacity='.6'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@400;500;600;700&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.14.4/dist/browser/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.14.4/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-from: #0d0b14;
            --bg-to: #130f22;
            --surface: rgba(255, 255, 255, 0.04);
            --surface-hover: rgba(255, 255, 255, 0.07);
            --glass: rgba(15, 12, 26, 0.75);
            --glass-border: rgba(167, 139, 250, 0.15);
            --border: rgba(255, 255, 255, 0.07);
            --text: rgba(255, 255, 255, 0.88);
            --text-mid: rgba(255, 255, 255, 0.5);
            --text-dim: rgba(255, 255, 255, 0.28);
            --accent: #a78bfa;
            --accent-2: #7c3aed;
            --accent-glow: rgba(167, 139, 250, 0.2);
            --accent-dim: rgba(167, 139, 250, 0.1);
            --red: #f87171;
            --font: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --panel-w: 340px;
            --radius: 16px;
            --radius-sm: 10px;
        }

        body, html {
            height: 100%;
            background: linear-gradient(135deg, var(--bg-from) 0%, var(--bg-to) 100%);
            color: var(--text);
            font-family: var(--font);
            font-weight: 400;
            overflow: hidden;
        }

        /* ─── VIEWER (fullscreen base) ─── */
        #viewer {
            position: fixed;
            inset: 0;
            overflow: hidden;
            transition: opacity 0.3s ease;
        }
        #viewer svg#markmap { width: 100%; height: 100%; }

        /* ─── TOPBAR ─── */
        #topbar {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 999px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(167,139,250,0.08);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        #topbar.hidden-ui {
            opacity: 0 !important;
            transform: translateX(-50%) translateY(-12px) !important;
            pointer-events: none;
            animation: none !important;
        }

        .logo {
            font-family: var(--font);
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logo-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            animation: pulse-dot 2.4s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.7); }
        }

        .sep { width: 1px; height: 18px; background: var(--border); margin: 0 2px; }

        .tb-btn {
            display: flex; align-items: center; gap: 5px;
            height: 32px; padding: 0 12px; border-radius: 999px;
            font-family: var(--font); font-size: 13px; font-weight: 500;
            cursor: pointer; transition: all 0.18s ease;
            border: 1px solid transparent;
            background: transparent; color: var(--text-mid);
            white-space: nowrap;
        }
        .tb-btn:hover { color: var(--text); background: var(--surface-hover); border-color: var(--border); }
        .tb-btn svg { flex-shrink: 0; }

        .tb-btn.primary {
            color: var(--accent);
            background: var(--accent-dim);
            border-color: rgba(167,139,250,0.25);
        }
        .tb-btn.primary:hover { background: rgba(167,139,250,0.18); }

        /* ─── EDITOR CARD (floating panel) ─── */
        #panel {
            position: fixed;
            top: 80px;
            left: 20px;
            bottom: 20px;
            width: var(--panel-w);
            z-index: 80;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.35s ease;
        }
        #panel.hidden-ui {
            transform: translateX(calc(-100% - 30px)) !important;
            opacity: 0 !important;
            pointer-events: none;
            animation: none !important;
        }


        .panel-card {
            background: #0f0c1a;
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 24px 64px rgba(0,0,0,0.7), 0 0 0 1px rgba(167,139,250,0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }


        /* ─── MAP DROPDOWN ─── */
        #maps-card {
            flex-shrink: 0;
            position: relative;
            z-index: 10;           /* fica acima do #editor-card no mesmo painel */
            overflow: visible;     /* permite que o dropdown flutue fora do card */
        }
        /* Trigger — linha única clicável */
        #map-trigger {
            display: flex; align-items: center; gap: 8px;
            padding: 9px 12px;
            cursor: pointer;
            transition: background 0.15s;
            border-radius: var(--radius);
            user-select: none;
        }
        #map-trigger:hover { background: rgba(255,255,255,0.03); }
        #map-trigger-icon { color: var(--accent); opacity: 0.8; flex-shrink: 0; }
        #map-trigger-name {
            flex: 1; min-width: 0;
            font-size: 13px; font-weight: 600;
            color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        #map-trigger-badge {
            font-size: 10px; font-family: var(--font-mono);
            color: var(--text-dim);
            background: rgba(255,255,255,0.05);
            border-radius: 999px; padding: 1px 7px;
            flex-shrink: 0;
        }
        #map-trigger-chevron {
            flex-shrink: 0; color: var(--text-dim);
            transition: transform 0.2s ease;
        }
        #maps-card.open #map-trigger-chevron { transform: rotate(180deg); }

        /* Dropdown panel — flutua abaixo do trigger */
        #map-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0; right: 0;
            background: #0f0c1a;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.7), 0 0 0 1px rgba(167,139,250,0.08);
            z-index: 200;
            overflow: hidden;
            padding: 8px;
            /* animação de abertura */
            transform-origin: top center;
            transform: scaleY(0.85) translateY(-6px);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.18s cubic-bezier(0.4,0,0.2,1),
                        opacity 0.15s ease;
        }
        #maps-card.open #map-dropdown {
            transform: scaleY(1) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        /* Search box */
        .map-search-wrap {
            position: relative; margin-bottom: 6px;
        }
        .map-search-icon {
            position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
            color: var(--text-dim); pointer-events: none;
            display: flex; align-items: center;
        }
        #map-search {
            width: 100%; box-sizing: border-box;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 8px 6px 28px;
            font-family: var(--font); font-size: 12px;
            color: var(--text); outline: none;
            transition: border-color 0.15s;
        }
        #map-search:focus { border-color: rgba(167,139,250,0.45); }
        #map-search::placeholder { color: var(--text-dim); }

        /* Map list */
        .map-list {
            display: flex; flex-direction: column; gap: 1px;
            max-height: 220px; overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(167,139,250,0.15) transparent;
        }
        .map-item {
            display: flex; align-items: center; gap: 7px;
            padding: 6px 8px; border-radius: 7px;
            cursor: pointer; transition: all 0.1s;
            border: 1px solid transparent;
            min-width: 0;
        }
        .map-item:hover { background: rgba(255,255,255,0.05); border-color: var(--border); }
        .map-item.active {
            background: var(--accent-dim);
            border-color: rgba(167,139,250,0.3);
        }
        .map-item-icon { flex-shrink: 0; color: var(--text-dim); opacity: 0.5; }
        .map-item.active .map-item-icon { color: var(--accent); opacity: 1; }
        .map-item-name {
            flex: 1; min-width: 0;
            font-size: 12.5px; font-weight: 500; color: var(--text-mid);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .map-item.active .map-item-name { color: var(--accent); }
        .map-item:hover .map-item-name { color: var(--text); }
        .map-item-del {
            flex-shrink: 0; width: 16px; height: 16px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 4px; font-size: 11px;
            opacity: 0; color: var(--text-dim); transition: all 0.1s;
        }
        .map-item:hover .map-item-del { opacity: 1; }
        .map-item-del:hover { background: rgba(248,113,113,0.18); color: #f87171; }
        .map-no-results {
            font-size: 11.5px; color: var(--text-dim);
            text-align: center; padding: 10px 0; font-style: italic;
        }
        /* Divider */
        .map-dropdown-sep {
            height: 1px; background: var(--border);
            margin: 6px 0;
        }
        /* New map button */
        .btn-new-map {
            display: flex; align-items: center; gap: 6px;
            width: 100%; padding: 6px 8px; border-radius: 7px;
            font-size: 12px; font-weight: 500;
            color: var(--text-dim); cursor: pointer;
            border: none; background: transparent;
            transition: all 0.12s;
        }
        .btn-new-map:hover { color: var(--accent); background: var(--accent-dim); }
        /* Rename input */
        .map-rename-input {
            flex: 1; min-width: 0;
            background: transparent; border: none; outline: none;
            font-family: var(--font); font-size: 12.5px; font-weight: 500;
            color: var(--accent); padding: 0;
        }

        /* Editor section */
        #editor-card {
            flex: 1;
            min-height: 0;
        }
        .editor-header {
            padding: 12px 16px 0;
            display: flex; align-items: center; justify-content: space-between;
        }
        .editor-title {
            font-size: 11px; font-weight: 500; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--text-dim);
        }
        #char-count {
            font-size: 11px; color: var(--text-dim); font-family: var(--font-mono);
        }
        #editor {
            display: block;
            width: 100%;
            flex: 1;
            padding: 14px 16px 16px;
            font-family: var(--font-mono); font-size: 12.5px; line-height: 1.8;
            background: transparent;
            color: rgba(255,255,255,0.72);
            border: none; outline: none; resize: none;
            tab-size: 2;
            scrollbar-width: thin;
            scrollbar-color: rgba(167,139,250,0.15) transparent;
            height: calc(100% - 44px);
        }
        #editor::placeholder { color: var(--text-dim); font-style: italic; }



        /* ─── FABs ─── */
        #fabs {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 200;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        #fabs.hidden-ui {
            opacity: 0 !important;
            transform: translateY(12px) !important;
            pointer-events: none;
            animation: none !important;
        }

        .fab {
            width: 44px; height: 44px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--glass-border);
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: var(--text-mid); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.18s ease;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            position: relative;
        }
        .fab:hover {
            border-color: rgba(167,139,250,0.4);
            color: var(--accent);
            background: rgba(15, 12, 26, 0.9);
            box-shadow: 0 4px 24px rgba(167,139,250,0.15);
            transform: translateY(-1px);
        }
        .fab.active {
            border-color: rgba(167,139,250,0.5);
            color: var(--accent);
            background: var(--accent-dim);
        }
        .fab-tip {
            position: absolute;
            right: calc(100% + 8px);
            top: 50%; transform: translateY(-50%);
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 11.5px; font-weight: 500;
            color: var(--text-mid);
            white-space: nowrap;
            opacity: 0; pointer-events: none;
            transition: opacity 0.15s ease;
        }
        .fab:hover .fab-tip { opacity: 1; }

        /* ─── PROGRESS ─── */
        #progress {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 2px;
            z-index: 300;
            pointer-events: none;
        }
        #progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--accent-2), var(--accent));
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px rgba(167,139,250,0.6);
        }

        /* ─── TOAST ─── */
        #toast {
            position: fixed; bottom: 28px; left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            border-radius: 999px;
            padding: 8px 18px;
            font-size: 13px; font-weight: 500;
            color: var(--text-mid);
            z-index: 999; opacity: 0;
            transition: all 0.22s ease;
            pointer-events: none; white-space: nowrap;
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ─── FOCUS HINT ─── */
        #focus-hint {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex; align-items: center; gap: 6px;
            padding: 6px 14px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            border-radius: 999px;
            font-size: 12px; color: var(--text-dim);
            z-index: 50;
            opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease;
        }
        #focus-hint.visible { opacity: 1; }
        kbd {
            background: rgba(255,255,255,0.07);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1px 6px;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-mid);
        }

        /* ─── MARKMAP OVERRIDES ─── */
        .markmap-node-circle { r: 3.5px !important; }
        .markmap-node { transition: opacity 0.3s ease; }
        .markmap-node-text { transition: opacity 0.3s ease, fill 0.3s ease; }
        .markmap-link { stroke-width: 1.5px !important; stroke-opacity: 0.5 !important; }

        /* Focus mode highlight */
        #viewer .markmap-node { opacity: 0.08 !important; transition: opacity 0.4s !important; }
        #viewer .markmap-link { stroke-opacity: 0.04 !important; transition: stroke-opacity 0.4s !important; }
        #viewer .markmap-node.focused { opacity: 1 !important; }
        #viewer .markmap-node.focused .markmap-node-text { opacity: 1 !important; font-weight: 700 !important; }
        #viewer .markmap-node.focused-ancestor { opacity: 0.55 !important; }
        #viewer:not(:has(.focused)) .markmap-node { opacity: 1 !important; }
        #viewer:not(:has(.focused)) .markmap-link { stroke-opacity: 0.5 !important; }

        /* Images inside markmap */
        .markmap-node-text img {
            display: block !important;
            max-width: 180px !important;
            max-height: 140px !important;
            border-radius: 8px;
            margin: 6px 0;
            object-fit: contain;
        }
        foreignObject { overflow: visible !important; }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(167,139,250,0.15); border-radius: 2px; }

        /* ─── ANIMATIONS ─── */
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #topbar { animation: fade-in 0.5s ease both; }
        #panel { animation: fade-in 0.5s 0.1s ease both; }
        #fabs { animation: fade-in 0.5s 0.2s ease both; }

        /* ─── LASER POINTER ─── */
        #laser-canvas {
            position: fixed;
            inset: 0;
            z-index: 600;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        #laser-canvas.active { opacity: 1; }
        body.laser-mode { cursor: none !important; }
        body.laser-mode * { cursor: none !important; }

        /* FAB laser ativo fica vermelho */
        #fab-laser.laser-on {
            border-color: rgba(255, 80, 80, 0.6) !important;
            color: #ff5050 !important;
            background: rgba(255, 60, 60, 0.15) !important;
            box-shadow: 0 4px 24px rgba(255, 60, 60, 0.3) !important;
        }
        #fab-laser.laser-on:hover {
            background: rgba(255, 60, 60, 0.25) !important;
        }
        @keyframes laser-pulse {
            0%, 100% { box-shadow: 0 4px 24px rgba(255,60,60,0.3); }
            50% { box-shadow: 0 4px 32px rgba(255,60,60,0.6), 0 0 0 3px rgba(255,60,60,0.15); }
        }
        #fab-laser.laser-on { animation: laser-pulse 1.4s ease-in-out infinite; }

        /* ─── THEMES DRAWER ─── */
        #themes-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 490; opacity: 0; pointer-events: none;
            transition: opacity 0.25s ease;
        }
        #themes-overlay.open { opacity: 1; pointer-events: auto; }

        #themes-drawer {
            position: fixed;
            top: 0; right: 0; bottom: 0; width: 340px;
            background: #09070f;
            border-left: 1px solid var(--glass-border);
            box-shadow: -32px 0 80px rgba(0,0,0,0.7);
            z-index: 500;
            display: flex; flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        #themes-drawer.open { transform: translateX(0); }

        .drawer-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 16px 14px;
            border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        .drawer-title {
            display: flex; align-items: center; gap: 8px;
            font-size: 14px; font-weight: 700; color: var(--text);
        }
        .drawer-close {
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 6px; background: transparent;
            color: var(--text-dim); cursor: pointer; font-size: 14px;
            border: none; transition: all 0.12s;
        }
        .drawer-close:hover { background: var(--surface-hover); color: var(--text); }

        #themes-list {
            flex: 1; overflow-y: auto; padding: 8px;
            scrollbar-width: thin;
            scrollbar-color: rgba(167,139,250,0.15) transparent;
        }
        .theme-card {
            border: 1px solid var(--border); border-radius: 10px;
            padding: 10px 12px; margin-bottom: 5px;
            background: rgba(255,255,255,0.02); transition: all 0.12s;
        }
        .theme-card:hover { background: rgba(255,255,255,0.04); border-color: rgba(167,139,250,0.25); }
        .theme-card.active { background: var(--accent-dim); border-color: rgba(167,139,250,0.4); }
        .theme-card-main {
            display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
        }
        .theme-swatches { display: flex; gap: 4px; flex-shrink: 0; }
        .theme-swatch {
            width: 14px; height: 14px; border-radius: 50%;
            border: 1.5px solid rgba(255,255,255,0.15); display: inline-block;
        }
        .theme-name { flex: 1; font-size: 13px; font-weight: 600; color: var(--text); }
        .theme-active-badge {
            font-size: 10px; font-weight: 600;
            color: var(--accent); background: var(--accent-dim);
            border: 1px solid rgba(167,139,250,0.3);
            border-radius: 999px; padding: 1px 7px;
        }
        .theme-card-actions { display: flex; align-items: center; gap: 5px; }
        .theme-btn {
            flex: 1; padding: 5px 0; border-radius: 6px;
            font-size: 12px; font-weight: 600; color: var(--accent);
            background: var(--accent-dim); border: 1px solid rgba(167,139,250,0.3);
            cursor: pointer; transition: all 0.12s;
        }
        .theme-btn:hover { background: rgba(167,139,250,0.25); }
        .theme-btn-icon {
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 6px; background: transparent;
            color: var(--text-dim); border: 1px solid var(--border);
            cursor: pointer; transition: all 0.12s; flex-shrink: 0;
        }
        .theme-btn-icon:hover { background: var(--surface-hover); color: var(--text); }
        .theme-btn-icon.danger:hover {
            background: rgba(248,113,113,0.15); color: #f87171;
            border-color: rgba(248,113,113,0.3);
        }

        /* Theme editor */
        #theme-editor {
            padding: 12px; border-top: 1px solid var(--border);
            background: rgba(0,0,0,0.25); flex-shrink: 0;
        }
        #theme-editor.hidden { display: none; }
        .theme-editor-lbl {
            font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
            text-transform: uppercase; color: var(--text-dim);
            margin-bottom: 5px; display: block;
        }
        #theme-editor-name {
            width: 100%; box-sizing: border-box;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border); border-radius: 8px;
            padding: 7px 10px; font-family: var(--font); font-size: 13px;
            color: var(--text); outline: none; margin-bottom: 10px;
            transition: border-color 0.15s;
        }
        #theme-editor-name:focus { border-color: rgba(167,139,250,0.5); }
        #theme-editor-name::placeholder { color: var(--text-dim); }
        #theme-editor-yaml {
            width: 100%; box-sizing: border-box;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border); border-radius: 8px;
            padding: 8px 10px; font-family: var(--font-mono); font-size: 12px;
            color: rgba(255,255,255,0.72); outline: none;
            resize: vertical; min-height: 120px; line-height: 1.7;
            transition: border-color 0.15s;
        }
        #theme-editor-yaml:focus { border-color: rgba(167,139,250,0.5); }
        .theme-editor-row { display: flex; gap: 6px; margin-top: 8px; }
        .btn-theme-save {
            flex: 1; padding: 7px; border-radius: 7px;
            font-size: 12.5px; font-weight: 600;
            background: var(--accent-dim); color: var(--accent);
            border: 1px solid rgba(167,139,250,0.35); cursor: pointer;
            transition: all 0.12s;
        }
        .btn-theme-save:hover { background: rgba(167,139,250,0.25); }
        .btn-theme-cancel {
            padding: 7px 14px; border-radius: 7px;
            font-size: 12.5px; font-weight: 500;
            background: transparent; color: var(--text-dim);
            border: 1px solid var(--border); cursor: pointer;
            transition: all 0.12s;
        }
        .btn-theme-cancel:hover { background: var(--surface-hover); color: var(--text); }

        .drawer-footer {
            padding: 10px 12px;
            border-top: 1px solid var(--border); flex-shrink: 0;
        }
        .btn-new-theme {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            width: 100%; padding: 8px; border-radius: 8px;
            font-size: 12.5px; font-weight: 500;
            color: var(--text-dim); cursor: pointer;
            border: 1px dashed rgba(167,139,250,0.3); background: transparent;
            transition: all 0.15s;
        }
        .btn-new-theme:hover { color: var(--accent); border-color: rgba(167,139,250,0.55); background: var(--accent-dim); }
    </style>
</head>
<body>

<!-- PROGRESS BAR -->
<div id="progress"><div id="progress-fill"></div></div>

<!-- LASER CANVAS -->

<!-- VIEWER -->

    <svg id="markmap"></svg>
</div>

<!-- TOPBAR -->
<div id="topbar">
    <div class="logo">
        <div class="logo-dot"></div>
        markmap
    </div>
    <div class="sep"></div>
    <button class="tb-btn" onclick="downloadMD()" title="Salvar .md">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>

    </button>
    <button class="tb-btn" onclick="triggerImport()" title="Importar backup">

    <div class="sep"></div>
    <button class="tb-btn" onclick="openThemesDrawer()" id="btn-themes" title="Gerenciar temas">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        Foco
    </button>
</div>

<!-- EDITOR PANEL -->
<div id="panel">
    <!-- Map dropdown -->
    <div class="panel-card" id="maps-card">
        <!-- Trigger: mostra apenas o mapa ativo -->
        <div id="map-trigger" onclick="toggleMapDropdown()">
            <span id="map-trigger-icon">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            </span>
            <span id="map-trigger-name">Mapa 1</span>
            <span id="map-trigger-badge">1</span>
            <span id="map-trigger-chevron">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            </span>
        </div>

        <!-- Dropdown flutuante -->
        <div id="map-dropdown">
            <div class="map-search-wrap">
                <span class="map-search-icon">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </span>
                <input id="map-search" type="text" placeholder="Buscar mapa..." oninput="filterMaps(this.value)" autocomplete="off">
            </div>
            <div class="map-list" id="tabs-container"></div>
            <div class="map-dropdown-sep"></div>
            <button class="btn-new-map" onclick="newMap()">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Novo mapa
            </button>
        </div>
    </div>

    <!-- Editor -->
    <div class="panel-card" id="editor-card">
        <div class="editor-header">
            <span class="editor-title">Markdown</span>
            <span id="char-count">0 chars</span>
        </div>
        <textarea id="editor" placeholder="# Título do mapa&#10;- Tópico principal&#10;  - Subtópico&#10;  - Outro subtópico&#10;- Segundo tópico&#10;  - Detalhe&#10;&#10;Use - e indentação para criar hierarquia"></textarea>
    </div>
</div>

<!-- FABs -->
<div id="fabs">
    <button class="fab" id="fab-editor" onclick="toggleEditor()" title="Editor">
        <span class="fab-tip">Editor&nbsp;&nbsp;<kbd>E</kbd></span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    </button>
    <button class="fab" id="fab-laser" onclick="toggleLaser()" title="Ponteiro laser">
        <span class="fab-tip">Laser&nbsp;&nbsp;<kbd>L</kbd></span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="19.07" y1="4.93" x2="16.24" y2="7.76"/><line x1="7.76" y1="16.24" x2="4.93" y2="19.07"/></svg>
    </button>
    <button class="fab" id="fab-expand" onclick="toggleExpandAll()" title="Expandir tudo">

        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    </button>
    <button class="fab" onclick="resetZoom()">

        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
    </button>
    <button class="fab" onclick="stepBackward()">
        <span class="fab-tip">Anterior&nbsp;&nbsp;<kbd>←</kbd></span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>

</div>

<!-- FOCUS HINT -->

    <kbd>←</kbd><kbd>→</kbd> navegar · <kbd>A</kbd> expandir · <kbd>L</kbd> laser · <kbd>E</kbd> editor · <kbd>Esc</kbd> sair do foco
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- THEMES OVERLAY -->
<div id="themes-overlay" onclick="closeThemesDrawer()"></div>

<!-- THEMES DRAWER -->
<div id="themes-drawer">
    <div class="drawer-header">
        <span class="drawer-title">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
            Temas
        </span>
        <button class="drawer-close" onclick="closeThemesDrawer()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
    </div>
    <div id="themes-list"></div>
    <div id="theme-editor" class="hidden">
        <label class="theme-editor-lbl">Nome do tema</label>
        <input id="theme-editor-name" type="text" placeholder="Ex: Dark Ocean">
        <label class="theme-editor-lbl">Propriedades (YAML)</label>
        <textarea id="theme-editor-yaml" spellcheck="false"></textarea>
        <div class="theme-editor-row">
            <button class="btn-theme-save" onclick="saveThemeEdit()">Salvar tema</button>
            <button class="btn-theme-cancel" onclick="cancelThemeEdit()">Cancelar</button>
        </div>
    </div>
    <div class="drawer-footer">
        <button class="btn-new-theme" onclick="newTheme()">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Novo tema
        </button>
    </div>
</div>

<script>
// ─── STATE ─────────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'mindmap_studio_v2';
const { Transformer, Markmap } = window.markmap;

let currentFocusedNode = null;
let editorVisible = true;
let focusMode = false;

const transformer = new Transformer([]);

let mm = null;
let currentRoot = null;
let themeColors = { link: '', accent: '', maxWidth: 260 };
let isPaperTheme = false;

let maps = [];
let activeId = null;
let renderTimeout = null;
let currentNavIndex = 0;
let nodeCounter = 0;
let isFirstRender = true;   // controla se deve recolher o mapa ao renderizar
let isAllExpanded = false;  // rastrea se o mapa está totalmente expandido

let themes = [];
let editingThemeId = null;

const DEFAULT_THEMES = [
    {
        id: 'builtin-dark',
        name: 'Dark Purple',
        config: {
            tema: 'dark',
            cor_linhas: '#a78bfa',
            cor_destaque: '#c4b5fd',
            cor_fonte: 'rgba(255,255,255,0.85)',
            font_family: 'Outfit'
        }
    },
    {
        id: 'builtin-light',
        name: 'Light',
        config: {
            tema: 'white',
            cor_linhas: 'rgba(109,40,217,0.35)',
            cor_destaque: '#7c3aed',
            cor_fonte: '#1e1b4b',
            font_family: 'Outfit'
        }
    },
    {
        id: 'builtin-caneta',
        name: 'Caneta',
        config: {
            tema: 'caneta',
            cor_linhas: '#3b2a1e',
            cor_destaque: '#7c3a1a',
            cor_fonte: '#1c1007',
            font_family: 'Caveat'
        }
    }
];

const editorEl     = document.getElementById('editor');
const progressFill = document.getElementById('progress-fill');
const charCount    = document.getElementById('char-count');
const toastEl      = document.getElementById('toast');
const panelEl      = document.getElementById('panel');
const viewerEl     = document.getElementById('viewer');
const tabsContainer= document.getElementById('tabs-container');
const topbarEl     = document.getElementById('topbar');
const fabsEl       = document.getElementById('fabs');
const focusHint    = document.getElementById('focus-hint');
const fabEditor    = document.getElementById('fab-editor');
const laserCanvas  = document.getElementById('laser-canvas');
const laserCtx     = laserCanvas.getContext('2d');

// ─── LASER STATE ──────────────────────────────────────────────────────────────
let laserMode  = false;
let laserPos   = { x: 0, y: 0 };
let laserTrail = [];          // [{x, y}] — posições recentes do mouse
let laserRaf   = null;        // requestAnimationFrame handle
const TRAIL_LEN = 28;         // comprimento do rastro

// ─── DEFAULT CONTENT ──────────────────────────────────────────────────────────
const DEFAULT_MAP = `---
tema: dark
cor_linhas: "#a78bfa"
cor_destaque: "#c4b5fd"
cor_fonte: "rgba(255,255,255,0.85)"
font_family: "Outfit"
---
# Markmap ✦
- Como escrever
  - A raiz é o título com \`#\`
  - Use \`-\` e indentação para criar ramos
    - Dois espaços = um nível mais fundo
    - Tão simples quanto uma lista
  - **negrito**, *itálico* e \`código\` funcionam
  - [Links](https://youtube.com) também
- Para apresentações
  - Ative o **Modo Foco** no topo da tela
  - Use ← → para revelar nó por nó
  - O mapa começa fechado — drama garantido
  - Pressione F para encaixar na tela
- Personalize as cores
  - Edite o bloco \`---\` no topo do editor
  - \`cor_linhas\` — cor dos ramos
  - \`cor_fonte\` — cor do texto
  - \`font_family\` — fonte (qualquer Google Font)
- Exportar
  - PNG em alta resolução via botão no topo
  - Salvar \`.md\` para editar depois`;

// ─── STORAGE ──────────────────────────────────────────────────────────────────
function loadState() {
    try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved?.maps?.length) {
            maps = saved.maps;
            activeId = saved.activeId || maps[0].id;
            editorVisible = saved.editorVisible !== undefined ? saved.editorVisible : true;
            // Carrega temas salvos, mas garante que os temas padrão sempre existam
            const saved_themes = Array.isArray(saved.themes) ? saved.themes : [];
            const builtinIds = new Set(DEFAULT_THEMES.map(t => t.id));
            const userThemes = saved_themes.filter(t => !builtinIds.has(t.id));
            themes = [...DEFAULT_THEMES, ...userThemes];
            return;
        }
    } catch(e) {}
    maps = [{ id: uid(), name: 'Mapa 1', content: DEFAULT_MAP }];
    activeId = maps[0].id;
    themes = [...DEFAULT_THEMES];
}

function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ maps, activeId, editorVisible, themes }));
    } catch(e) { toast('⚠ Erro ao salvar'); }
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// ─── INIT ─────────────────────────────────────────────────────────────────────
function init() {
    loadState();
    editorEl.value = maps.find(m => m.id === activeId)?.content || '';
    renderTabs();
    applyEditorVisibility();
    render();
}

// ─── MAP DROPDOWN ───────────────────────────────────────────────────────────
let mapFilter = '';
const mapsCard = document.getElementById('maps-card');

function updateTrigger() {
    const active = maps.find(m => m.id === activeId);
    const nameEl  = document.getElementById('map-trigger-name');
    const badgeEl = document.getElementById('map-trigger-badge');
    if (nameEl)  nameEl.textContent  = active?.name || 'Mapa';
    if (badgeEl) badgeEl.textContent = maps.length;
}

function toggleMapDropdown() {
    const isOpen = mapsCard.classList.toggle('open');
    if (isOpen) {
        // Limpa busca e foca o campo
        const search = document.getElementById('map-search');
        if (search) { search.value = ''; filterMaps(''); search.focus(); }
        // Rola o item ativo para a vista
        const activeItem = tabsContainer.querySelector('.map-item.active');
        if (activeItem) setTimeout(() => activeItem.scrollIntoView({ block: 'nearest' }), 50);
    }
}

function closeMapDropdown() {
    mapsCard.classList.remove('open');
}

// Fecha o dropdown ao clicar fora
document.addEventListener('click', e => {
    if (mapsCard && !mapsCard.contains(e.target)) closeMapDropdown();
});

function renderTabs() {
    const query = mapFilter.toLowerCase();
    const visible = maps.filter(m => m.name.toLowerCase().includes(query));

    tabsContainer.innerHTML = '';
    updateTrigger();

    if (visible.length === 0) {
        tabsContainer.innerHTML = '<div class="map-no-results">Nenhum mapa encontrado</div>';
        return;
    }

    visible.forEach(m => {
        const item = document.createElement('div');
        item.className = 'map-item' + (m.id === activeId ? ' active' : '');
        item.dataset.id = m.id;
        item.innerHTML = `
            <span class="map-item-icon">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            </span>
            <span class="map-item-name">${escHtml(m.name)}</span>
            <span class="map-item-del" data-id="${m.id}" title="Remover">✕</span>
        `;

        item.addEventListener('click', e => {
            if (e.target.classList.contains('map-item-del') || e.target.closest('.map-item-del')) {
                closeMap(e.target.closest('[data-id]').dataset.id); return;
            }
            if (e.target.classList.contains('map-rename-input')) return;
            switchMap(m.id);
            closeMapDropdown();
        });

        item.querySelector('.map-item-name').addEventListener('dblclick', e => {
            e.stopPropagation();
            startRename(item, m.id);
        });

        tabsContainer.appendChild(item);
    });

    // Rola o item ativo para a vista
    const activeItem = tabsContainer.querySelector('.map-item.active');
    if (activeItem) activeItem.scrollIntoView({ block: 'nearest' });
}

function filterMaps(val) {
    mapFilter = val;
    renderTabs();
}

function startRename(item, id) {
    const label = item.querySelector('.map-item-name');
    const m = maps.find(x => x.id === id);
    const input = document.createElement('input');
    input.className = 'map-rename-input';
    input.value = m.name;
    label.replaceWith(input);
    input.focus(); input.select();
    function commit() {
        m.name = input.value.trim() || m.name;
        saveState(); renderTabs();
    }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
        if (e.key === 'Escape') { input.value = m.name; input.blur(); }
        e.stopPropagation();
    });
    input.addEventListener('click', e => e.stopPropagation());
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function switchMap(id) {
    if (activeId === id) return;
    const cur = maps.find(m => m.id === activeId);
    if (cur) cur.content = editorEl.value;
    activeId = id;
    const m = maps.find(m => m.id === id);
    editorEl.value = m.content;
    isFirstRender = true;  // força recolher ao trocar de mapa
    renderTabs();
    scheduleRender();
    saveState();
}

function newMap() {
    const cur = maps.find(m => m.id === activeId);
    if (cur) cur.content = editorEl.value;
    const m = { id: uid(), name: `Mapa ${maps.length + 1}`, content: `# Novo Mapa\n- Tópico 1\n  - Subtópico\n  - Outro subtópico\n- Tópico 2\n  - Detalhe` };
    maps.push(m);
    activeId = m.id;
    editorEl.value = m.content;
    isFirstRender = true;
    renderTabs();
    closeMapDropdown();
    scheduleRender();
    saveState();
}

function closeMap(id) {
    if (maps.length === 1) { toast('Mínimo 1 mapa'); return; }
    maps = maps.filter(m => m.id !== id);
    if (activeId === id) {
        activeId = maps[maps.length - 1].id;
        editorEl.value = maps.find(m => m.id === activeId).content;
        scheduleRender();
    }
    renderTabs();
    saveState();
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function scheduleRender(delay = 300) {
    clearTimeout(renderTimeout);
    renderTimeout = setTimeout(render, delay);
}

function preprocessMarkdown(md) {
    if (md.trimStart().startsWith('---')) {
        const end = md.indexOf('---', 3);
        if (end !== -1) md = md.slice(end + 3).trimStart();
    }
    md = md.replace(/!IMG\[([^\]]+)\]/g, (_, url) => {
        url = url.trim();
        if (!isValidImageUrl(url)) return `_(url inválida)_`;
        return `<img src="${url}" style="max-width:180px;max-height:130px;border-radius:8px;display:block;margin:4px 0">`;
    });
    md = md.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (match, alt, src) => {
        return isValidImageUrl(src.trim()) ? match : (alt ? `_(${alt})_` : '');
    });
    return md;
}

function isValidImageUrl(url) {
    try {
        const u = new URL(url);
        return u.protocol === 'http:' || u.protocol === 'https:' || u.protocol === 'data:';
    } catch { return false; }
}

function extractConfig(md) {
    if (!md.startsWith('---')) return {};
    const parts = md.split('---');
    if (parts.length < 3) return {};
    try {
        const inline = jsyaml.load(parts[1]) || {};
        // Resolve preset: mescla config do tema com valores inline (inline ganha)
        if (inline.preset) {
            const theme = themes.find(t => t.name === inline.preset);
            if (theme) return { ...theme.config, ...inline };
        }
        return inline;
    } catch(e) { return {}; }
}

// Extrai config SEM resolver preset (para detectar preset ativo)
function extractConfigRaw(md) {
    if (!md.startsWith('---')) return {};
    const parts = md.split('---');
    if (parts.length < 3) return {};
    try { return jsyaml.load(parts[1]) || {}; } catch(e) { return {}; }
}

// Converte qualquer cor CSS (hex, rgb, rgba) para rgba com opacidade personalizada
function toRgba(color, alpha) {
    // Hex curto: #abc
    let m = color.match(/^#([0-9a-f]{3})$/i);
    if (m) {
        const [r, g, b] = m[1].split('').map(x => parseInt(x + x, 16));
        return `rgba(${r},${g},${b},${alpha})`;
    }
    // Hex longo: #aabbcc
    m = color.match(/^#([0-9a-f]{6})$/i);
    if (m) {
        const r = parseInt(m[1].slice(0,2), 16);
        const g = parseInt(m[1].slice(2,4), 16);
        const b = parseInt(m[1].slice(4,6), 16);
        return `rgba(${r},${g},${b},${alpha})`;
    }
    // rgb(r,g,b)
    m = color.match(/^rgb\s*\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/i);
    if (m) return `rgba(${m[1]},${m[2]},${m[3]},${alpha})`;
    // rgba — substitui o alpha existente
    m = color.match(/^rgba\s*\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*,\s*[\d.]+\s*\)$/i);
    if (m) return `rgba(${m[1]},${m[2]},${m[3]},${alpha})`;
    return color; // fallback: devolve a cor original
}

    const accent    = config.cor_destaque || (isPaper ? '#7c3a1a'              : dark ? '#a78bfa'                : '#7c3aed');
    const font      = config.font_family  || (isPaper ? 'Caveat'               : 'Outfit');
    const fontSize  = isPaper ? '18px' : '14px';
    const fontStack = isPaper ? 'cursive' : 'sans-serif';

    } else {
        // Dark (padrão) — restaura valores originais

        root.style.setProperty('--text',          'rgba(255,255,255,0.88)');

    // Fundo de papel pautado com margem azul

// Captura o estado de fold atual antes de re-renderizar
function captureFoldState(node, map = new Map()) {
    if (!node) return map;
    map.set(node.content || node.data?.content || '', node.payload?.fold ?? 0);
    if (node.children) node.children.forEach(c => captureFoldState(c, map));
    return map;
}

// Restaura o estado de fold baseado no conteúdo do nó
function restoreFoldState(node, map) {
    if (!node) return;
    const key = node.content || node.data?.content || '';
    if (map.has(key)) {
        if (!node.payload) node.payload = {};
        node.payload.fold = map.get(key);
    }
    if (node.children) node.children.forEach(c => restoreFoldState(c, map));
}

async function render() {
    nodeCounter = 0;
    const raw = editorEl.value;
    const md = preprocessMarkdown(raw);
    const config = extractConfig(raw);
    applyTheme(config);

    let root, features;
    try {
        ({ root, features } = transformer.transform(md));
    } catch(e) { return; }

    // Salva o estado de fold ANTES de trocar currentRoot
    const prevFoldState = currentRoot ? captureFoldState(currentRoot) : null;

    currentRoot = root;
    linkParents(currentRoot);

    if (isFirstRender || !prevFoldState) {
        // Primeiro render: recolhe tudo
        currentNavIndex = 0;
        currentFocusedNode = currentRoot;
        foldAll(currentRoot);
        isFirstRender = false;

        isAllExpanded = checkAllExpanded(currentRoot);
        updateExpandBtn();

        if (!mm) {
            mm = Markmap.create('#markmap', {
                autoFit: false,
                duration: 450,
                maxWidth: themeColors.maxWidth,
                spacingVertical: 10,
                spacingHorizontal: 64,
                paddingX: 14,
                zoom: true,
                pan: true,
                color: (node) => {
                    const content = node.data?.content || node.content || '';
                    return content.includes('(!!)') ? themeColors.accent : themeColors.link;
                }
            }, currentRoot);
        } else {
            mm.setOptions({ maxWidth: themeColors.maxWidth, color: (node) => (node.data?.content || node.content || '').includes('(!!)') ? themeColors.accent : themeColors.link });
            mm.setData(currentRoot);
        }
        mm.fit();
        // Re-layout após o browser processar o CSS (evita sobreposição de nós)
        requestAnimationFrame(() => requestAnimationFrame(() => {
            if (mm && currentRoot) { mm.setData(currentRoot); mm.fit(); }
        }));
        setTimeout(forceRecolorNodes, 520);

        if (currentFocusedNode) {
            centerOnNode(currentFocusedNode);
            highlightNode(currentFocusedNode);
        }

    } else {
        // Re-render por edição: restaura o estado anterior SEM mover a câmera
        restoreFoldState(currentRoot, prevFoldState);

        isAllExpanded = checkAllExpanded(currentRoot);
        updateExpandBtn();

        // Preserva a transformação de zoom/pan atual antes de setData
        const svg = document.getElementById('markmap');
        const savedTransform = svg ? d3.zoomTransform(svg) : null;

        mm.setOptions({
            maxWidth: themeColors.maxWidth,
            color: (node) => (node.data?.content || node.content || '').includes('(!!)') ? themeColors.accent : themeColors.link
        });
        mm.setData(currentRoot);
        // Re-layout após o browser processar o CSS (evita sobreposição de nós)
        requestAnimationFrame(() => requestAnimationFrame(() => {
            if (!mm || !currentRoot) return;
            const svg2 = document.getElementById('markmap');
            const t2 = svg2 ? d3.zoomTransform(svg2) : null;
            mm.setData(currentRoot);
            if (t2 && svg2 && mm.zoom) requestAnimationFrame(() => d3.select(svg2).call(mm.zoom.transform, t2));
        }));
        setTimeout(forceRecolorNodes, 520);

        // Restaura a posição da câmera após setData
        if (savedTransform && svg && mm.zoom) {
            requestAnimationFrame(() => {
                d3.select(svg).call(mm.zoom.transform, savedTransform);
            });
        }
    }

    updateProgress();
    charCount.textContent = `${raw.length} chars`;
    setTimeout(forceRootVisible, 50);
    setTimeout(forceRootVisible, 500);
    setTimeout(injectSketchFilter, 80);   // caneta theme
    setTimeout(injectSketchFilter, 520);  // re-inject after animation
    setTimeout(applyHighlights, 100);     // (!!) destaque
    setTimeout(applyHighlights, 600);     // re-apply after animation
}

// ─── HIGHLIGHT (!!) ───────────────────────────────────────────────────────────

// Retorna preto ou branco dependendo da luminância percebida da cor de destaque
function contrastColor(hex) {
    const m = hex.match(/^#([0-9a-f]{6})$/i);
    if (!m) return '#fff';
    const r = parseInt(m[1].slice(0,2), 16);
    const g = parseInt(m[1].slice(2,4), 16);
    const b = parseInt(m[1].slice(4,6), 16);
    return (0.299*r + 0.587*g + 0.114*b) > 148 ? '#1c1340' : '#fff';
}

// ─── FORÇA RECOLORAÇÃO DOS NÓS APÓS TROCA DE TEMA ───────────────────────────
// O D3 aplica cores via atributos SVG inline (fill/stroke). Depois do setData,
// percorremos o SVG e sobrescrevemos esses atributos com os valores atuais do tema.
function forceRecolorNodes() {
    const svg = document.getElementById('markmap');
    if (!svg) return;

    // Recolore os círculos dos nós
    svg.querySelectorAll('.markmap-node-circle').forEach(el => {
        const isAccent = el.closest('.markmap-node')?.classList.contains('markmap-accent');
        el.setAttribute('fill', isAccent ? themeColors.accent : themeColors.link);
    });

    // Recolore as linhas/ramos
    svg.querySelectorAll('.markmap-link').forEach(el => {
        el.setAttribute('stroke', themeColors.link);
    });

    // Remove cor inline dos textos (deixa o CSS com !important assumir)
    svg.querySelectorAll('.markmap-node-text').forEach(el => {
        el.removeAttribute('fill');
        el.style.removeProperty('fill');
    });

    // Re-aplica destaques depois
    setTimeout(applyHighlights, 50);
}

function applyHighlights() {

    const svg = document.getElementById('markmap');
    if (!svg) return;

    const accent    = themeColors.accent;
    const textColor = contrastColor(accent);

    svg.querySelectorAll('g.markmap-node').forEach(g => {
        const fo = g.querySelector('foreignObject div');
        if (!fo) return;

        // includes() encontra (!!) visível OU dentro do sentinela oculto [data-mm-hl]
        const isAccent = fo.innerHTML.includes('(!!)');

        if (isAccent) {
            g.classList.add('markmap-accent');

            // Substitui (!!) visível por sentinela oculto — mantém no DOM para detecções futuras
            if (!fo.querySelector('[data-mm-hl]')) {
                fo.innerHTML = fo.innerHTML.replace(
                    /\s*\(!!\)\s*/g,
                    '<span data-mm-hl>(!!)</span>'   // CSS esconde via [data-mm-hl]
                );
            }

            // Preenchimento sólido com a cor de destaque
            fo.style.setProperty('background',    accent,     'important');
            fo.style.setProperty('border-radius', '4px',      'important');
            fo.style.setProperty('padding',       '1px 8px',  'important');
            fo.style.setProperty('color',         textColor,  'important');
            fo.style.setProperty('font-weight',   '700',      'important');

            // Também aplica no rect caso o markmap o renderize
            const rect = g.querySelector('rect');
            if (rect) rect.style.setProperty('fill', accent, 'important');

        } else {
            g.classList.remove('markmap-accent');
            fo.style.removeProperty('background');
            fo.style.removeProperty('border-radius');
            fo.style.removeProperty('padding');
            fo.style.removeProperty('color');
            fo.style.removeProperty('font-weight');

            const rect = g.querySelector('rect');
            if (rect) rect.style.removeProperty('fill');
        }
    });
}


// ─── SKETCH FILTER (tema: caneta) ────────────────────────────────────────────
function injectSketchFilter() {
    const svg = document.getElementById('markmap');
    if (!svg) return;

    if (!isPaperTheme) {
        // Remove filter se saiu do tema caneta
        svg.querySelectorAll('.markmap-link[filter]').forEach(el => el.removeAttribute('filter'));
        return;
    }

    // Garante que o elemento <defs> existe no SVG
    let defs = svg.querySelector('defs');
    if (!defs) {
        defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
        svg.insertBefore(defs, svg.firstChild);
    }

    // Injeta o filtro de esboço uma única vez
    if (!defs.querySelector('#sketch-filter')) {
        const filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
        filter.id = 'sketch-filter';
        filter.setAttribute('x', '-8%');
        filter.setAttribute('y', '-8%');
        filter.setAttribute('width', '116%');
        filter.setAttribute('height', '116%');
        // feTurbulence gera ruído fractal; feDisplacementMap aplica esse ruído
        // como deslocamento nos pixels — resultado: linhas com tremor natural de caneta
        filter.innerHTML =
            '<feTurbulence type="fractalNoise" baseFrequency="0.035 0.028" numOctaves="4" seed="12" result="noise"/>' +
            '<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.8" xChannelSelector="R" yChannelSelector="G"/>';
        defs.appendChild(filter);
    }

    // Aplica o filtro em todos os ramos do mapa
    svg.querySelectorAll('.markmap-link').forEach(el => {
        el.setAttribute('filter', 'url(#sketch-filter)');
    });
}

function forceRootVisible() {
    const svg = document.getElementById('markmap');
    if (!svg) return;
    svg.querySelectorAll('foreignObject').forEach(fo => {
        fo.style.removeProperty('visibility');
        fo.style.removeProperty('display');
        fo.setAttribute('visibility', 'visible');
        const div = fo.querySelector('div');
        if (div) { div.style.removeProperty('opacity'); div.style.removeProperty('display'); }
    });
}

function flatNodes(node, list = []) {
    list.push(node);
    if (node.children) node.children.forEach(c => flatNodes(c, list));
    return list;
}

function foldAll(root) {
    if (!root.children) return;
    root.children.forEach(child => foldAllRecursive(child));
}
function foldAllRecursive(node) {
    if (!node.payload) node.payload = {};
    if (node.children?.length > 0) {
        node.payload.fold = 1;
        node.children.forEach(foldAllRecursive);
    }
}

function expandAllRecursive(node) {
    if (!node.payload) node.payload = {};
    node.payload.fold = 0;
    if (node.children) node.children.forEach(expandAllRecursive);
}

function checkAllExpanded(node) {
    if (node.children?.length > 0) {
        if (node.payload?.fold) return false;
        return node.children.every(checkAllExpanded);
    }
    return true;
}

function expandAll() {
    if (!currentRoot || !mm) return;
    expandAllRecursive(currentRoot);
    isAllExpanded = true;
    updateExpandBtn();
    mm.setData(currentRoot);
    updateProgress();
    setTimeout(() => mm?.fit(), 150);
    setTimeout(applyHighlights, 600);
    toast('Mapa totalmente expandido');
}

function collapseAll() {
    if (!currentRoot || !mm) return;
    foldAll(currentRoot);
    isAllExpanded = false;
    updateExpandBtn();
    currentNavIndex = 0;
    currentFocusedNode = currentRoot;
    mm.setData(currentRoot);
    updateProgress();
    setTimeout(() => mm?.fit(), 150);
    setTimeout(applyHighlights, 600);
    toast('Mapa recolhido');
}

function toggleExpandAll() {
    if (isAllExpanded) collapseAll();
    else expandAll();
}

function updateExpandBtn() {
    const btn = document.getElementById('fab-expand');
    if (!btn) return;
    if (isAllExpanded) {
        btn.classList.add('active');
        btn.querySelector('.fab-tip').innerHTML = 'Recolher&nbsp;&nbsp;<kbd>A</kbd>';
        btn.title = 'Recolher tudo';
    } else {
        btn.classList.remove('active');
        btn.querySelector('.fab-tip').innerHTML = 'Expandir tudo&nbsp;&nbsp;<kbd>A</kbd>';
        btn.title = 'Expandir tudo';
    }
}

function updateProgress() {
    if (!currentRoot) return;
    const nodes = flatNodes(currentRoot);
    const branches = nodes.filter(n => n.children?.length > 0);
    if (!branches.length) return;
    const opened = branches.filter(n => !n.payload?.fold || n.payload.fold === 0).length;
    progressFill.style.width = `${(opened / branches.length) * 100}%`;
}

// ─── NODE NAVIGATION ──────────────────────────────────────────────────────────
function linkParents(node, parent = null) {
    node.parent = parent;
    node.id = ++nodeCounter;
    if (node.children) node.children.forEach(child => linkParents(child, node));
}

function centerOnNode(node) {
    if (!mm || !node) return;
    setTimeout(() => {
        try {
            const svg = document.getElementById('markmap');
            if (!svg) return;
            const zoom = mm.zoom;
            if (!zoom) return;
            const viewerRect = svg.getBoundingClientRect();
            const cx = viewerRect.width / 2;
            const cy = viewerRect.height / 2;
            const nodeGs = Array.from(svg.querySelectorAll('g.markmap-node'));
            let targetG = null;
            for (const g of nodeGs) {
                const d = g.__data__;
                if (d && (d.id === node.id || d.data?.id === node.id || d === node)) { targetG = g; break; }
            }
            if (!targetG) return;
            const nodeRect = targetG.getBoundingClientRect();
            const nodeCx = nodeRect.left + nodeRect.width / 2 - viewerRect.left;
            const nodeCy = nodeRect.top + nodeRect.height / 2 - viewerRect.top;
            const currentTransform = d3.zoomTransform(svg);
            const k = currentTransform.k;
            const dx = cx - nodeCx;
            const dy = cy - nodeCy;
            const newTransform = d3.zoomIdentity.translate(currentTransform.x + dx, currentTransform.y + dy).scale(k);
            d3.select(svg).transition().duration(700).ease(d3.easeCubicInOut).call(zoom.transform, newTransform);
        } catch(e) {}
    }, 150);
}

function stepForward() {
    if (!currentRoot) return;
    const all = flatNodes(currentRoot);
    if (currentNavIndex < all.length - 1) {
        currentNavIndex++;
        const next = all[currentNavIndex];
        let p = next.parent;
        let needed = false;
        while (p) {
            if (p.payload?.fold) { p.payload.fold = 0; needed = true; }
            p = p.parent;
        }
        if (needed) {
            mm.setData(currentRoot);
            updateProgress();
            setTimeout(() => { currentFocusedNode = next; centerOnNode(next); highlightNode(next); }, 150);
            setTimeout(applyHighlights, 600);
        } else {
            currentFocusedNode = next; centerOnNode(next); highlightNode(next);
        }
    }
}

function stepBackward() {
    if (!currentRoot) return;
    const all = flatNodes(currentRoot);
    if (currentNavIndex > 0) {
        currentNavIndex--;
        const prev = all[currentNavIndex];
        currentFocusedNode = prev;
        centerOnNode(prev);
        highlightNode(prev);
    }
}

function highlightNode(node) {
    const svg = document.getElementById('markmap');
    if (!svg) return;
    svg.querySelectorAll('.markmap-node.focused').forEach(el => el.classList.remove('focused'));
    svg.querySelectorAll('.markmap-node.focused-ancestor').forEach(el => el.classList.remove('focused-ancestor'));
    if (!node) return;
    const nodeGs = Array.from(svg.querySelectorAll('g.markmap-node'));
    let targetG = null;
    for (const g of nodeGs) {
        const d = g.__data__;
        if (d && (d.id === node.id || d.data?.id === node.id || d === node)) { targetG = g; break; }
    }
    if (targetG) {
        targetG.classList.add('focused');
        let parent = node.parent;
        while (parent) {
            for (const g of nodeGs) {
                const d = g.__data__;
                if (d && (d.id === parent.id || d.data?.id === parent.id || d === parent)) { g.classList.add('focused-ancestor'); break; }
            }
            parent = parent.parent;
        }
    }
}

// ─── UI ACTIONS ───────────────────────────────────────────────────────────────
function applyEditorVisibility() {
    panelEl.classList.toggle('hidden-ui', !editorVisible);
    fabEditor.classList.toggle('active', editorVisible);
    setTimeout(() => mm?.fit(), 380);
}

function toggleEditor() {
    editorVisible = !editorVisible;

}

function resetZoom() { mm?.fit(); }

function enterFocusMode() {

    topbarEl.classList.add('hidden-ui');
    panelEl.classList.add('hidden-ui');
    fabsEl.classList.add('hidden-ui');

}

    try {

function downloadMD() {

    const a = document.createElement('a');

// ─── BACKUP / IMPORT ──────────────────────────────────────────────────────────
function exportBackup() {
    // Garante que o mapa ativo está atualizado antes de exportar
    const cur = maps.find(m => m.id === activeId);
    if (cur) cur.content = editorEl.value;

    const now = new Date();
    const dateStr = now.toISOString().slice(0, 10);
    const timeStr = now.toTimeString().slice(0, 5).replace(':', 'h');

    const payload = {
        _version: 2,
        _app: 'markmap',
        _exported: now.toISOString(),
        _count: maps.length,
        maps,
        activeId,
        themes,
    };

    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.download = `markmap-backup-${dateStr}-${timeStr}.json`;
    a.href = URL.createObjectURL(blob);
    a.click();
    URL.revokeObjectURL(a.href);
    toast(`✓ Backup de ${maps.length} mapa${maps.length !== 1 ? 's' : ''} + ${themes.length} tema${themes.length !== 1 ? 's' : ''} exportado`);
}

function triggerImport() {
    document.getElementById('import-input').value = '';   // permite re-selecionar o mesmo arquivo
    document.getElementById('import-input').click();
}

function importBackup(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = e => {
        let payload;
        try {
            payload = JSON.parse(e.target.result);
        } catch {
            toast('⚠ Arquivo inválido — não é um JSON');
            return;
        }

        // Validação básica da estrutura
        if (!payload?.maps || !Array.isArray(payload.maps) || payload.maps.length === 0) {
            toast('⚠ Backup inválido ou vazio');
            return;
        }

        const incoming = payload.maps;
        const dateInfo = payload._exported
            ? ` (exportado em ${new Date(payload._exported).toLocaleDateString('pt-BR')})`
            : '';

        const choice = window.confirm(
            `Backup encontrado: ${incoming.length} mapa${incoming.length !== 1 ? 's' : ''}${dateInfo}.\n\n` +
            `• OK → Adicionar ao lado dos mapas atuais\n` +
            `• Cancelar → Substituir TODOS os mapas atuais\n\n` +
            `Você tem ${maps.length} mapa${maps.length !== 1 ? 's' : ''} atualmente.`
        );

        // Salva o mapa ativo antes de qualquer mudança
        const cur = maps.find(m => m.id === activeId);
        if (cur) cur.content = editorEl.value;

        if (choice) {
            // MERGE — adiciona, evita IDs duplicados regenerando
            const imported = incoming.map(m => ({ ...m, id: uid() }));
            maps = [...maps, ...imported];
            // Mescla temas sem duplicar por nome
            if (payload.themes?.length) {
                const existingNames = new Set(themes.map(t => t.name));
                const newThemes = payload.themes.filter(t => !existingNames.has(t.name))
                    .map(t => ({ ...t, id: uid() }));
                themes = [...themes, ...newThemes];
                if (newThemes.length) toast(`✓ ${imported.length} mapa(s) + ${newThemes.length} tema(s) adicionado(s)`);
                else toast(`✓ ${imported.length} mapa${imported.length !== 1 ? 's' : ''} adicionado${imported.length !== 1 ? 's' : ''}`);
            } else {
                toast(`✓ ${imported.length} mapa${imported.length !== 1 ? 's' : ''} adicionado${imported.length !== 1 ? 's' : ''}`);
            }
        } else {
            // REPLACE — substitui tudo
            maps = incoming.map(m => ({ ...m, id: uid() }));
            activeId = maps[0].id;
            editorEl.value = maps[0].content;
            isFirstRender = true;
            if (payload.themes?.length) themes = payload.themes;
            toast(`✓ ${maps.length} mapa${maps.length !== 1 ? 's' : ''} restaurado${maps.length !== 1 ? 's' : ''}`);
        }

        renderTabs();
        saveState();
        scheduleRender();
    };

    reader.readAsText(file);
}

function toast(msg, duration = 2200) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), duration);
}

// ─── THEMES MANAGER ─────────────────────────────────────────────────────────────────
function openThemesDrawer() {
    document.getElementById('themes-drawer').classList.add('open');
    document.getElementById('themes-overlay').classList.add('open');
    renderThemeCards();
}

function closeThemesDrawer() {
    document.getElementById('themes-drawer').classList.remove('open');
    document.getElementById('themes-overlay').classList.remove('open');
    cancelThemeEdit();
}

// Detecta o preset ativo no mapa atual
function currentPresetName() {
    return extractConfigRaw(editorEl.value).preset || null;
}

function renderThemeCards() {
    const list = document.getElementById('themes-list');
    const activePreset = currentPresetName();
    list.innerHTML = '';

    if (themes.length === 0) {
        list.innerHTML = '<p style="color:var(--text-dim);font-size:12px;text-align:center;padding:20px 0;">Nenhum tema criado</p>';
        return;
    }

    themes.forEach(t => {
        const isActive = activePreset === t.name;
        const linkColor  = t.config.cor_linhas  || '#a78bfa';
        const accentColor = t.config.cor_destaque || '#c4b5fd';

        const card = document.createElement('div');
        card.className = 'theme-card' + (isActive ? ' active' : '');
        card.innerHTML = `
            <div class="theme-card-main">
                <div class="theme-swatches">
                    <span class="theme-swatch" style="background:${escHtml(linkColor)}" title="Cor das linhas"></span>
                    <span class="theme-swatch" style="background:${escHtml(accentColor)}" title="Cor de destaque"></span>
                </div>
                <span class="theme-name">${escHtml(t.name)}</span>
                ${isActive ? '<span class="theme-active-badge">✓ ativo</span>' : ''}
            </div>
            <div class="theme-card-actions">
                <button class="theme-btn" onclick="applyThemeToMap('${t.id}')">${isActive ? 'Remover' : 'Aplicar'}</button>
                <button class="theme-btn-icon" onclick="editTheme('${t.id}')" title="Editar">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </button>
                <button class="theme-btn-icon danger" onclick="deleteTheme('${t.id}')" title="Excluir">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
                </button>
            </div>
        `;
        list.appendChild(card);
    });
}

function applyThemeToMap(id) {
    const theme = themes.find(t => t.id === id);
    if (!theme) return;

    let content = editorEl.value;
    const isActive = currentPresetName() === theme.name;

    if (isActive) {
        // Remove o preset do frontmatter
        if (content.trimStart().startsWith('---')) {
            const end = content.indexOf('---', 3);
            if (end !== -1) {
                let fm = content.slice(3, end).replace(/^preset:.*\n?/m, '').trim();
                const rest = content.slice(end + 3);
                content = fm ? `---\n${fm}\n---${rest}` : rest.trimStart();
            }
        }
        toast(`Tema "${theme.name}" removido`);
    } else {
        // Insere ou atualiza o preset no frontmatter
        if (content.trimStart().startsWith('---')) {
            const end = content.indexOf('---', 3);
            if (end !== -1) {
                let fm = content.slice(3, end).replace(/^preset:.*\n?/m, '');
                const rest = content.slice(end + 3);
                content = `---\npreset: "${theme.name}"\n${fm.trimStart()}---${rest}`;
            }
        } else {
            content = `---\npreset: "${theme.name}"\n---\n${content}`;
        }
        toast(`Tema "${theme.name}" aplicado`);
    }

    editorEl.value = content;
    const cur = maps.find(m => m.id === activeId);
    if (cur) cur.content = content;
    scheduleRender(100);
    saveState();
    renderThemeCards();
}

function newTheme() {
    editingThemeId = null;
    document.getElementById('theme-editor-name').value = '';
    document.getElementById('theme-editor-yaml').value =
`tema: dark
cor_linhas: "#a78bfa"
cor_destaque: "#c4b5fd"
cor_fonte: "rgba(255,255,255,0.85)"
font_family: "Outfit"`;
    document.getElementById('theme-editor').classList.remove('hidden');
    document.getElementById('theme-editor-name').focus();
}

function editTheme(id) {
    const theme = themes.find(t => t.id === id);
    if (!theme) return;
    editingThemeId = id;
    document.getElementById('theme-editor-name').value = theme.name;
    // Serializa config para YAML simples
    const yamlStr = Object.entries(theme.config)
        .map(([k, v]) => `${k}: ${typeof v === 'string' ? `"${v}"` : v}`)
        .join('\n');
    document.getElementById('theme-editor-yaml').value = yamlStr;
    document.getElementById('theme-editor').classList.remove('hidden');
    document.getElementById('theme-editor-name').focus();
}

function saveThemeEdit() {
    const name = document.getElementById('theme-editor-name').value.trim();
    const yamlText = document.getElementById('theme-editor-yaml').value.trim();

    if (!name) { toast('⚠ Informe o nome do tema'); return; }

    let config;
    try { config = jsyaml.load(yamlText) || {}; }
    catch(e) { toast('⚠ YAML inválido: ' + String(e.message).slice(0, 60)); return; }

    if (editingThemeId) {
        const theme = themes.find(t => t.id === editingThemeId);
        if (theme) { theme.name = name; theme.config = config; }
    } else {
        themes.push({ id: uid(), name, config });
    }

    saveState();
    renderThemeCards();
    cancelThemeEdit();
    toast(`✓ Tema "${name}" salvo`);
}

function cancelThemeEdit() {
    editingThemeId = null;
    const el = document.getElementById('theme-editor');
    if (el) el.classList.add('hidden');
}

function deleteTheme(id) {
    const theme = themes.find(t => t.id === id);
    if (!theme) return;
    if (!confirm(`Excluir o tema "${theme.name}"?`)) return;
    themes = themes.filter(t => t.id !== id);
    saveState();
    renderThemeCards();
    toast(`Tema "${theme.name}" excluído`);
}

// Fecha drawer com Escape
document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && document.getElementById('themes-drawer')?.classList.contains('open')) {
        closeThemesDrawer();
    }
});


// ─── EVENTS ───────────────────────────────────────────────────────────────────
editorEl.addEventListener('input', () => {
    const cur = maps.find(m => m.id === activeId);
    if (cur) cur.content = editorEl.value;
    charCount.textContent = `${editorEl.value.length} chars`;
    scheduleRender();
    saveState();
});

window.addEventListener('keydown', e => {
    const tag = document.activeElement?.tagName;
    if (document.activeElement === editorEl) return;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (e.key === 'Escape') {
        if (laserMode) { toggleLaser(); return; }
        if (focusMode) exitFocusMode();
        return;
    }
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); stepForward(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); stepBackward(); }
    else if (e.key.toLowerCase() === 'e') toggleEditor();
    else if (e.key.toLowerCase() === 'f') resetZoom();
    else if (e.key.toLowerCase() === 'a') { e.preventDefault(); toggleExpandAll(); }
    else if (e.key.toLowerCase() === 'l') { e.preventDefault(); toggleLaser(); }
    else if (e.ctrlKey && e.key.toLowerCase() === 't') { e.preventDefault(); newMap(); }
});

window.addEventListener('mousemove', e => {
    laserPos = { x: e.clientX, y: e.clientY };
    if (!laserMode) return;
    laserTrail.push({ x: e.clientX, y: e.clientY });
    if (laserTrail.length > TRAIL_LEN) laserTrail.shift();
});

window.addEventListener('resize', () => {
    mm?.fit();
    if (laserMode) {
        laserCanvas.width  = window.innerWidth;
        laserCanvas.height = window.innerHeight;
    }
});

// ─── LASER POINTER ────────────────────────────────────────────────────────────
function toggleLaser() {
    laserMode = !laserMode;
    const btn = document.getElementById('fab-laser');

    if (laserMode) {
        laserCanvas.width  = window.innerWidth;
        laserCanvas.height = window.innerHeight;
        laserCanvas.classList.add('active');
        document.body.classList.add('laser-mode');
        if (btn) btn.classList.add('laser-on');
        laserTrail = [];
        laserRaf = requestAnimationFrame(drawLaser);
        toast('Laser ligado — L ou Esc para desligar');
    } else {
        laserCanvas.classList.remove('active');
        document.body.classList.remove('laser-mode');
        if (btn) btn.classList.remove('laser-on');
        cancelAnimationFrame(laserRaf);
        laserCtx.clearRect(0, 0, laserCanvas.width, laserCanvas.height);
        laserTrail = [];
        toast('Laser desligado');
    }
}

function drawLaser() {
    if (!laserMode) return;

    const W = laserCanvas.width;
    const H = laserCanvas.height;
    laserCtx.clearRect(0, 0, W, H);

    const trailLen = laserTrail.length;

    // ── Rastro ──
    for (let i = 0; i < trailLen; i++) {
        const t     = i / (trailLen - 1 || 1);   // 0 = mais antigo, 1 = mais novo
        const alpha = t * t * 0.55;               // fade quadrático
        const r     = 2 + (1 - t) * 10;          // raio encolhe no ponto atual
        const pt    = laserTrail[i];

        const grad = laserCtx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, r * 2.5);
        grad.addColorStop(0, `rgba(255, 80, 60, ${alpha})`);
        grad.addColorStop(1, `rgba(255, 40, 20, 0)`);

        laserCtx.beginPath();
        laserCtx.arc(pt.x, pt.y, r * 2.5, 0, Math.PI * 2);
        laserCtx.fillStyle = grad;
        laserCtx.fill();
    }

    // ── Ponto principal ──
    const { x, y } = laserPos;

    // Halo externo grande (difuso)
    const outerGrad = laserCtx.createRadialGradient(x, y, 0, x, y, 38);
    outerGrad.addColorStop(0,   'rgba(255, 80, 60, 0.28)');
    outerGrad.addColorStop(0.4, 'rgba(255, 50, 30, 0.14)');
    outerGrad.addColorStop(1,   'rgba(255, 30, 10, 0)');
    laserCtx.beginPath();
    laserCtx.arc(x, y, 38, 0, Math.PI * 2);
    laserCtx.fillStyle = outerGrad;
    laserCtx.fill();

    // Halo interno (brilhante)
    const innerGrad = laserCtx.createRadialGradient(x, y, 0, x, y, 13);
    innerGrad.addColorStop(0,   'rgba(255, 180, 160, 0.95)');
    innerGrad.addColorStop(0.4, 'rgba(255, 80,  50, 0.75)');
    innerGrad.addColorStop(1,   'rgba(255, 40,  10, 0)');
    laserCtx.beginPath();
    laserCtx.arc(x, y, 13, 0, Math.PI * 2);
    laserCtx.fillStyle = innerGrad;
    laserCtx.fill();

    // Núcleo branco central
    const coreGrad = laserCtx.createRadialGradient(x, y, 0, x, y, 3.5);
    coreGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
    coreGrad.addColorStop(1, 'rgba(255, 200, 180, 0)');
    laserCtx.beginPath();
    laserCtx.arc(x, y, 3.5, 0, Math.PI * 2);
    laserCtx.fillStyle = coreGrad;
    laserCtx.fill();

    laserRaf = requestAnimationFrame(drawLaser);
}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markmap — Mapas Mentais</title>
    <meta name="description" content="Crie mapas mentais elegantes a partir de texto Markdown, de forma simples e rápida.">
    <meta name="theme-color" content="#a78bfa">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Markmap">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d0b14'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23a78bfa'/%3E%3Ccircle cx='6' cy='9' r='2' fill='%23a78bfa' opacity='.7'/%3E%3Ccircle cx='6' cy='23' r='2' fill='%23a78bfa' opacity='.7'/%3E%3Ccircle cx='26' cy='9' r='2' fill='%23c4b5fd' opacity='.6'/%3E%3Ccircle cx='26' cy='23' r='2' fill='%23c4b5fd' opacity='.6'/%3E%3Cline x1='13' y1='14' x2='8' y2='10' stroke='%23a78bfa' stroke-width='1.2' opacity='.6'/%3E%3Cline x1='13' y1='18' x2='8' y2='22' stroke='%23a78bfa' stroke-width='1.2' opacity='.6'/%3E%3Cline x1='19' y1='14' x2='24' y2='10' stroke='%23a78bfa' stroke-width='1.2' opacity='.6'/%3E%3Cline x1='19' y1='18' x2='24' y2='22' stroke='%23a78bfa' stroke-width='1.2' opacity='.6'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@400;500;600;700&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.14.4/dist/browser/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.14.4/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-from: #0d0b14;
            --bg-to: #130f22;
            --surface: rgba(255, 255, 255, 0.04);
            --surface-hover: rgba(255, 255, 255, 0.07);
            --glass: rgba(15, 12, 26, 0.75);
            --glass-border: rgba(167, 139, 250, 0.15);
            --border: rgba(255, 255, 255, 0.07);
            --text: rgba(255, 255, 255, 0.88);
            --text-mid: rgba(255, 255, 255, 0.5);
            --text-dim: rgba(255, 255, 255, 0.28);
            --accent: #a78bfa;
            --accent-2: #7c3aed;
            --accent-glow: rgba(167, 139, 250, 0.2);
            --accent-dim: rgba(167, 139, 250, 0.1);
            --red: #f87171;
            --font: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --panel-w: 340px;
            --radius: 16px;
            --radius-sm: 10px;
        }

        body, html {
            height: 100%;
            background: linear-gradient(135deg, var(--bg-from) 0%, var(--bg-to) 100%);
            color: var(--text);
            font-family: var(--font);
            font-weight: 400;
            overflow: hidden;
        }

        /* ─── VIEWER (fullscreen base) ─── */
        #viewer {
            position: fixed;
            inset: 0;
            overflow: hidden;
            transition: opacity 0.3s ease;
        }
        #viewer svg#markmap { width: 100%; height: 100%; }

        /* ─── TOPBAR ─── */
        #topbar {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 999px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(167,139,250,0.08);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        #topbar.hidden-ui {
            opacity: 0 !important;
            transform: translateX(-50%) translateY(-12px) !important;
            pointer-events: none;
            animation: none !important;
        }

        .logo {
            font-family: var(--font);
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logo-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            animation: pulse-dot 2.4s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.7); }
        }

        .sep { width: 1px; height: 18px; background: var(--border); margin: 0 2px; }

        .tb-btn {
            display: flex; align-items: center; gap: 5px;
            height: 32px; padding: 0 12px; border-radius: 999px;
            font-family: var(--font); font-size: 13px; font-weight: 500;
            cursor: pointer; transition: all 0.18s ease;
            border: 1px solid transparent;
            background: transparent; color: var(--text-mid);
            white-space: nowrap;
        }
        .tb-btn:hover { color: var(--text); background: var(--surface-hover); border-color: var(--border); }
        .tb-btn svg { flex-shrink: 0; }

        .tb-btn.primary {
            color: var(--accent);
            background: var(--accent-dim);
            border-color: rgba(167,139,250,0.25);
        }
        .tb-btn.primary:hover { background: rgba(167,139,250,0.18); }

        /* ─── EDITOR CARD (floating panel) ─── */
        #panel {
            position: fixed;
            top: 80px;
            left: 20px;
            bottom: 20px;
            width: var(--panel-w);
            z-index: 80;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.35s ease;
        }
        #panel.hidden-ui {
            transform: translateX(calc(-100% - 30px)) !important;
            opacity: 0 !important;
            pointer-events: none;
            animation: none !important;
        }


        .panel-card {
            background: #0f0c1a;
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 24px 64px rgba(0,0,0,0.7), 0 0 0 1px rgba(167,139,250,0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }


        /* Maps section */
        #maps-card {
            flex-shrink: 0;
            padding: 12px;
        }
        .maps-label {
            font-size: 10px; font-weight: 500; letter-spacing: 0.1em;
            text-transform: uppercase; color: var(--text-dim);
            padding: 0 4px; margin-bottom: 8px;
        }
        .map-tabs {
            display: flex; flex-wrap: wrap; gap: 5px;
        }
        .tab {
            display: flex; align-items: center; gap: 4px;
            padding: 4px 10px; border-radius: 999px;
            font-size: 12.5px; font-weight: 500;
            color: var(--text-mid); cursor: pointer;
            border: 1px solid transparent;
            background: transparent;
            transition: all 0.15s ease;
        }
        .tab:hover { color: var(--text); background: var(--surface-hover); border-color: var(--border); }
        .tab.active {
            color: var(--accent);
            background: var(--accent-dim);
            border-color: rgba(167,139,250,0.3);
        }
        .close-tab {
            width: 14px; height: 14px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; font-size: 10px; line-height: 1;
            opacity: 0; color: var(--text-dim);
            transition: all 0.12s;
        }
        .tab:hover .close-tab { opacity: 1; }
        .close-tab:hover { background: rgba(248,113,113,0.2); color: var(--red); }
        .tab-new {
            display: flex; align-items: center; gap: 4px;
            padding: 4px 10px; border-radius: 999px;
            font-size: 12.5px; font-weight: 500;
            color: var(--text-dim); cursor: pointer;
            border: 1px dashed var(--border);
            background: transparent;
            transition: all 0.15s ease;
        }
        .tab-new:hover { color: var(--accent); border-color: rgba(167,139,250,0.4); background: var(--accent-dim); }

        /* Editor section */
        #editor-card {
            flex: 1;
            min-height: 0;
        }
        .editor-header {
            padding: 12px 16px 0;
            display: flex; align-items: center; justify-content: space-between;
        }
        .editor-title {
            font-size: 11px; font-weight: 500; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--text-dim);
        }
        #char-count {
            font-size: 11px; color: var(--text-dim); font-family: var(--font-mono);
        }
        #editor {
            display: block;
            width: 100%;
            flex: 1;
            padding: 14px 16px 16px;
            font-family: var(--font-mono); font-size: 12.5px; line-height: 1.8;
            background: transparent;
            color: rgba(255,255,255,0.72);
            border: none; outline: none; resize: none;
            tab-size: 2;
            scrollbar-width: thin;
            scrollbar-color: rgba(167,139,250,0.15) transparent;
            height: calc(100% - 44px);
        }
        #editor::placeholder { color: var(--text-dim); font-style: italic; }

        /* Tab rename input */
        .tab-rename-input {
            background: transparent; border: none; outline: none;
            font-family: var(--font); font-size: 12.5px; font-weight: 500;
            color: var(--accent); width: 80px; padding: 0;
        }

        /* ─── FABs ─── */
        #fabs {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 200;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        #fabs.hidden-ui {
            opacity: 0 !important;
            transform: translateY(12px) !important;
            pointer-events: none;
            animation: none !important;
        }

        .fab {
            width: 44px; height: 44px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--glass-border);
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: var(--text-mid); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.18s ease;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            position: relative;
        }
        .fab:hover {
            border-color: rgba(167,139,250,0.4);
            color: var(--accent);
            background: rgba(15, 12, 26, 0.9);
            box-shadow: 0 4px 24px rgba(167,139,250,0.15);
            transform: translateY(-1px);
        }
        .fab.active {
            border-color: rgba(167,139,250,0.5);
            color: var(--accent);
            background: var(--accent-dim);
        }
        .fab-tip {
            position: absolute;
            right: calc(100% + 8px);
            top: 50%; transform: translateY(-50%);
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 11.5px; font-weight: 500;
            color: var(--text-mid);
            white-space: nowrap;
            opacity: 0; pointer-events: none;
            transition: opacity 0.15s ease;
        }
        .fab:hover .fab-tip { opacity: 1; }

        /* ─── PROGRESS ─── */
        #progress {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 2px;
            z-index: 300;
            pointer-events: none;
        }
        #progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--accent-2), var(--accent));
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px rgba(167,139,250,0.6);
        }

        /* ─── TOAST ─── */
        #toast {
            position: fixed; bottom: 28px; left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            border-radius: 999px;
            padding: 8px 18px;
            font-size: 13px; font-weight: 500;
            color: var(--text-mid);
            z-index: 999; opacity: 0;
            transition: all 0.22s ease;
            pointer-events: none; white-space: nowrap;
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ─── FOCUS HINT ─── */
        #focus-hint {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex; align-items: center; gap: 6px;
            padding: 6px 14px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            border-radius: 999px;
            font-size: 12px; color: var(--text-dim);
            z-index: 50;
            opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease;
        }
        #focus-hint.visible { opacity: 1; }
        kbd {
            background: rgba(255,255,255,0.07);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1px 6px;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-mid);
        }

        /* ─── MARKMAP OVERRIDES ─── */
        .markmap-node-circle { r: 3.5px !important; }
        .markmap-node { transition: opacity 0.3s ease; }
        .markmap-node-text { transition: opacity 0.3s ease, fill 0.3s ease; }
        .markmap-link { stroke-width: 1.5px !important; stroke-opacity: 0.5 !important; }

        /* Focus mode highlight */
        #viewer .markmap-node { opacity: 0.08 !important; transition: opacity 0.4s !important; }
        #viewer .markmap-link { stroke-opacity: 0.04 !important; transition: stroke-opacity 0.4s !important; }
        #viewer .markmap-node.focused { opacity: 1 !important; }
        #viewer .markmap-node.focused .markmap-node-text { opacity: 1 !important; font-weight: 700 !important; }
        #viewer .markmap-node.focused-ancestor { opacity: 0.55 !important; }
        #viewer:not(:has(.focused)) .markmap-node { opacity: 1 !important; }
        #viewer:not(:has(.focused)) .markmap-link { stroke-opacity: 0.5 !important; }

        /* Images inside markmap */
        .markmap-node-text img {
            display: block !important;
            max-width: 180px !important;
            max-height: 140px !important;
            border-radius: 8px;
            margin: 6px 0;
            object-fit: contain;
        }
        foreignObject { overflow: visible !important; }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(167,139,250,0.15); border-radius: 2px; }

        /* ─── ANIMATIONS ─── */
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #topbar { animation: fade-in 0.5s ease both; }
        #panel { animation: fade-in 0.5s 0.1s ease both; }
        #fabs { animation: fade-in 0.5s 0.2s ease both; }

        /* ─── LASER POINTER ─── */
        #laser-canvas {
            position: fixed;
            inset: 0;
            z-index: 600;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        #laser-canvas.active { opacity: 1; }
        body.laser-mode { cursor: none !important; }
        body.laser-mode * { cursor: none !important; }

        /* FAB laser ativo fica vermelho */
        #fab-laser.laser-on {
            border-color: rgba(255, 80, 80, 0.6) !important;
            color: #ff5050 !important;
            background: rgba(255, 60, 60, 0.15) !important;
            box-shadow: 0 4px 24px rgba(255, 60, 60, 0.3) !important;
        }
        #fab-laser.laser-on:hover {
            background: rgba(255, 60, 60, 0.25) !important;
        }
        @keyframes laser-pulse {
            0%, 100% { box-shadow: 0 4px 24px rgba(255,60,60,0.3); }
            50% { box-shadow: 0 4px 32px rgba(255,60,60,0.6), 0 0 0 3px rgba(255,60,60,0.15); }
        }
        #fab-laser.laser-on { animation: laser-pulse 1.4s ease-in-out infinite; }
    </style>
</head>
<body>

<!-- PROGRESS BAR -->
<div id="progress"><div id="progress-fill"></div></div>

<!-- LASER CANVAS -->
<canvas id="laser-canvas"></canvas>

<!-- VIEWER -->
<div id="viewer">
    <svg id="markmap"></svg>
</div>

<!-- TOPBAR -->
<div id="topbar">
    <div class="logo">
        <div class="logo-dot"></div>
        markmap
    </div>
    <div class="sep"></div>
    <button class="tb-btn" onclick="downloadMD()" title="Salvar .md">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Salvar
    </button>
    <button class="tb-btn" onclick="exportImage()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        Exportar PNG
    </button>
    <div class="sep"></div>
    <button class="tb-btn" onclick="exportBackup()" title="Exportar backup de todos os mapas">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/><rect x="3" y="3" width="6" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
        Backup
    </button>
    <button class="tb-btn" onclick="triggerImport()" title="Importar backup">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Importar
    </button>
    <input type="file" id="import-input" accept=".json" style="display:none" onchange="importBackup(event)">
    <div class="sep"></div>
    <button class="tb-btn primary" onclick="enterFocusMode()" title="Modo apresentação (Esc para sair)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        Foco
    </button>
</div>

<!-- EDITOR PANEL -->
<div id="panel">
    <!-- Maps tabs -->
    <div class="panel-card" id="maps-card">
        <div class="maps-label">Mapas</div>
        <div class="map-tabs" id="tabs-container"></div>
        <button class="tab-new" onclick="newMap()" style="margin-top:6px;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Novo mapa
        </button>
    </div>

    <!-- Editor -->
    <div class="panel-card" id="editor-card">
        <div class="editor-header">
            <span class="editor-title">Markdown</span>
            <span id="char-count">0 chars</span>
        </div>
        <textarea id="editor" placeholder="# Título do mapa&#10;- Tópico principal&#10;  - Subtópico&#10;  - Outro subtópico&#10;- Segundo tópico&#10;  - Detalhe&#10;&#10;Use - e indentação para criar hierarquia"></textarea>
    </div>
</div>

<!-- FABs -->
<div id="fabs">
    <button class="fab" id="fab-editor" onclick="toggleEditor()" title="Editor">
        <span class="fab-tip">Editor&nbsp;&nbsp;<kbd>E</kbd></span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    </button>
    <button class="fab" id="fab-laser" onclick="toggleLaser()" title="Ponteiro laser">
        <span class="fab-tip">Laser&nbsp;&nbsp;<kbd>L</kbd></span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="19.07" y1="4.93" x2="16.24" y2="7.76"/><line x1="7.76" y1="16.24" x2="4.93" y2="19.07"/></svg>
    </button>
    <button class="fab" id="fab-expand" onclick="toggleExpandAll()" title="Expandir tudo">
        <span class="fab-tip">Expandir tudo&nbsp;&nbsp;<kbd>A</kbd></span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    </button>
    <button class="fab" onclick="resetZoom()">
        <span class="fab-tip">Fit&nbsp;&nbsp;<kbd>F</kbd></span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
    </button>
    <button class="fab" onclick="stepBackward()">
        <span class="fab-tip">Anterior&nbsp;&nbsp;<kbd>←</kbd></span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <button class="fab" onclick="stepForward()">
        <span class="fab-tip">Próximo&nbsp;&nbsp;<kbd>→</kbd></span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>
</div>

<!-- FOCUS HINT -->
<div id="focus-hint">
    <kbd>←</kbd><kbd>→</kbd> navegar · <kbd>A</kbd> expandir · <kbd>L</kbd> laser · <kbd>E</kbd> editor · <kbd>Esc</kbd> sair do foco
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ─── STATE ─────────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'mindmap_studio_v2';
const { Transformer, Markmap } = window.markmap;

let currentFocusedNode = null;
let editorVisible = true;
let focusMode = false;

const transformer = new Transformer([]);

let mm = null;
let currentRoot = null;
let themeColors = { link: '', accent: '', maxWidth: 260 };
let isPaperTheme = false;

let maps = [];
let activeId = null;
let renderTimeout = null;
let currentNavIndex = 0;
let nodeCounter = 0;
let isFirstRender = true;   // controla se deve recolher o mapa ao renderizar
let isAllExpanded = false;  // rastrea se o mapa está totalmente expandido

const editorEl     = document.getElementById('editor');
const progressFill = document.getElementById('progress-fill');
const charCount    = document.getElementById('char-count');
const toastEl      = document.getElementById('toast');
const panelEl      = document.getElementById('panel');
const viewerEl     = document.getElementById('viewer');
const tabsContainer= document.getElementById('tabs-container');
const topbarEl     = document.getElementById('topbar');
const fabsEl       = document.getElementById('fabs');
const focusHint    = document.getElementById('focus-hint');
const fabEditor    = document.getElementById('fab-editor');
const laserCanvas  = document.getElementById('laser-canvas');
const laserCtx     = laserCanvas.getContext('2d');

// ─── LASER STATE ──────────────────────────────────────────────────────────────
let laserMode  = false;
let laserPos   = { x: 0, y: 0 };
let laserTrail = [];          // [{x, y}] — posições recentes do mouse
let laserRaf   = null;        // requestAnimationFrame handle
const TRAIL_LEN = 28;         // comprimento do rastro

// ─── DEFAULT CONTENT ──────────────────────────────────────────────────────────
const DEFAULT_MAP = `---
tema: dark
cor_linhas: "#a78bfa"
cor_destaque: "#c4b5fd"
cor_fonte: "rgba(255,255,255,0.85)"
font_family: "Outfit"
---
# Markmap ✦
- Como escrever
  - A raiz é o título com \`#\`
  - Use \`-\` e indentação para criar ramos
    - Dois espaços = um nível mais fundo
    - Tão simples quanto uma lista
  - **negrito**, *itálico* e \`código\` funcionam
  - [Links](https://youtube.com) também
- Para apresentações
  - Ative o **Modo Foco** no topo da tela
  - Use ← → para revelar nó por nó
  - O mapa começa fechado — drama garantido
  - Pressione F para encaixar na tela
- Personalize as cores
  - Edite o bloco \`---\` no topo do editor
  - \`cor_linhas\` — cor dos ramos
  - \`cor_fonte\` — cor do texto
  - \`font_family\` — fonte (qualquer Google Font)
- Exportar
  - PNG em alta resolução via botão no topo
  - Salvar \`.md\` para editar depois`;

// ─── STORAGE ──────────────────────────────────────────────────────────────────
function loadState() {
    try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved?.maps?.length) {
            maps = saved.maps;
            activeId = saved.activeId || maps[0].id;
            editorVisible = saved.editorVisible !== undefined ? saved.editorVisible : true;
            return;
        }
    } catch(e) {}
    maps = [{ id: uid(), name: 'Mapa 1', content: DEFAULT_MAP }];
    activeId = maps[0].id;
}

function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ maps, activeId, editorVisible }));
    } catch(e) { toast('⚠ Erro ao salvar'); }
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// ─── INIT ─────────────────────────────────────────────────────────────────────
function init() {
    loadState();
    editorEl.value = maps.find(m => m.id === activeId)?.content || '';
    renderTabs();
    applyEditorVisibility();
    render();
}

// ─── TAB MANAGEMENT ───────────────────────────────────────────────────────────
function renderTabs() {
    tabsContainer.innerHTML = '';
    maps.forEach(m => {
        const tab = document.createElement('div');
        tab.className = 'tab' + (m.id === activeId ? ' active' : '');
        tab.dataset.id = m.id;
        tab.innerHTML = `<span class="tab-label">${escHtml(m.name)}</span><span class="close-tab" data-id="${m.id}">✕</span>`;

        tab.addEventListener('click', e => {
            if (e.target.classList.contains('close-tab')) { closeMap(e.target.dataset.id); return; }
            if (e.target.classList.contains('tab-rename-input')) return;
            switchMap(m.id);
        });

        tab.querySelector('.tab-label').addEventListener('dblclick', e => {
            e.stopPropagation();
            startRename(tab, m.id);
        });

        tabsContainer.appendChild(tab);
    });
}

function startRename(tab, id) {
    const label = tab.querySelector('.tab-label');
    const m = maps.find(x => x.id === id);
    const input = document.createElement('input');
    input.className = 'tab-rename-input';
    input.value = m.name;
    input.style.width = Math.max(60, label.offsetWidth) + 'px';
    label.replaceWith(input);
    input.focus(); input.select();
    function commit() {
        m.name = input.value.trim() || m.name;
        saveState(); renderTabs();
    }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
        if (e.key === 'Escape') { input.value = m.name; input.blur(); }
        e.stopPropagation();
    });
    input.addEventListener('click', e => e.stopPropagation());
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function switchMap(id) {
    if (activeId === id) return;
    const cur = maps.find(m => m.id === activeId);
    if (cur) cur.content = editorEl.value;
    activeId = id;
    const m = maps.find(m => m.id === id);
    editorEl.value = m.content;
    isFirstRender = true;  // força recolher ao trocar de mapa
    renderTabs();
    scheduleRender();
    saveState();
}

function newMap() {
    const cur = maps.find(m => m.id === activeId);
    if (cur) cur.content = editorEl.value;
    const m = { id: uid(), name: `Mapa ${maps.length + 1}`, content: `# Novo Mapa\n- Tópico 1\n  - Subtópico\n  - Outro subtópico\n- Tópico 2\n  - Detalhe` };
    maps.push(m);
    activeId = m.id;
    editorEl.value = m.content;
    isFirstRender = true;  // força recolher no novo mapa
    renderTabs();
    scheduleRender();
    saveState();
}

function closeMap(id) {
    if (maps.length === 1) { toast('Mínimo 1 mapa'); return; }
    maps = maps.filter(m => m.id !== id);
    if (activeId === id) {
        activeId = maps[maps.length - 1].id;
        editorEl.value = maps.find(m => m.id === activeId).content;
        scheduleRender();
    }
    renderTabs();
    saveState();
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function scheduleRender(delay = 300) {
    clearTimeout(renderTimeout);
    renderTimeout = setTimeout(render, delay);
}

function preprocessMarkdown(md) {
    if (md.trimStart().startsWith('---')) {
        const end = md.indexOf('---', 3);
        if (end !== -1) md = md.slice(end + 3).trimStart();
    }
    md = md.replace(/!IMG\[([^\]]+)\]/g, (_, url) => {
        url = url.trim();
        if (!isValidImageUrl(url)) return `_(url inválida)_`;
        return `<img src="${url}" style="max-width:180px;max-height:130px;border-radius:8px;display:block;margin:4px 0">`;
    });
    md = md.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (match, alt, src) => {
        return isValidImageUrl(src.trim()) ? match : (alt ? `_(${alt})_` : '');
    });
    return md;
}

function isValidImageUrl(url) {
    try {
        const u = new URL(url);
        return u.protocol === 'http:' || u.protocol === 'https:' || u.protocol === 'data:';
    } catch { return false; }
}

function extractConfig(md) {
    if (!md.startsWith('---')) return {};
    const parts = md.split('---');
    if (parts.length < 3) return {};
    try { return jsyaml.load(parts[1]) || {}; } catch(e) { return {}; }
}

function applyTheme(config) {
    const isPaper = config.tema === 'caneta';
    const dark    = !isPaper && config.tema !== 'white';

    // Defaults por tema
    const linkColor = config.cor_linhas   || (isPaper ? '#3b2a1e'              : dark ? 'rgba(167,139,250,0.45)' : 'rgba(109,40,217,0.35)');
    const fontColor = config.cor_fonte    || (isPaper ? '#1c1007'              : dark ? 'rgba(255,255,255,0.82)' : '#1e1b4b');
    const accent    = config.cor_destaque || (isPaper ? '#7c3a1a'              : dark ? '#a78bfa'                : '#7c3aed');
    const font      = config.font_family  || (isPaper ? 'Caveat'               : 'Outfit');
    const fontSize  = isPaper ? '18px' : '14px';   // Caveat lê melhor um pouco maior
    const fontStack = isPaper ? 'cursive' : 'sans-serif';
    const maxW      = config.max_largura  || 260;

    isPaperTheme         = isPaper;
    themeColors.link     = linkColor;
    themeColors.accent   = accent;
    themeColors.maxWidth = maxW;

    // Fundo de papel pautado com margem azul
    const paperBg = [
        'linear-gradient(90deg, transparent 64px, rgba(100,149,237,0.22) 64px, rgba(100,149,237,0.22) 66px, transparent 66px)',
        'repeating-linear-gradient(transparent 0px, transparent 27px, rgba(180,140,100,0.18) 27px, rgba(180,140,100,0.18) 28px)',
        '#fdf9ed'
    ].join(', ');

    document.getElementById('theme-css')?.remove();
    const s = document.createElement('style');
    s.id = 'theme-css';
    s.textContent = `
        #viewer { background: ${isPaper ? paperBg : dark ? 'transparent' : '#f5f3ff'}; }
        svg#markmap { background: transparent; }
        .markmap-node-text {
            fill: ${fontColor} !important;
            font-family: '${font}', ${fontStack} !important;
            font-size: ${fontSize} !important;
            font-weight: ${isPaper ? '600' : '500'} !important;
        }
        .markmap-node foreignObject div {
            color: ${fontColor} !important;
            font-family: '${font}', ${fontStack} !important;
            font-size: ${fontSize} !important;
            font-weight: ${isPaper ? '600' : '500'} !important;
            white-space: normal !important;
            word-wrap: break-word !important;
            overflow-wrap: break-word !important;
            line-height: 1.55 !important;
        }
        .markmap-link {
            stroke: ${linkColor} !important;
            stroke-width: ${isPaper ? '2px' : '1.5px'} !important;
            stroke-opacity: 1 !important;
            ${isPaper ? 'stroke-linecap: round !important; stroke-linejoin: round !important;' : ''}
        }
        .markmap-node-circle {
            fill: ${linkColor} !important;
            stroke: ${isPaper ? '#fdf9ed' : 'none'} !important;
            ${isPaper ? 'stroke-width: 2px !important; r: 4px !important;' : ''}
        }
        .markmap-accent .markmap-node-text { fill: ${accent} !important; font-weight: 700 !important; }
        .markmap-accent .markmap-node foreignObject div { color: ${accent} !important; font-weight: 700 !important; }
        .markmap-accent .markmap-node-circle { fill: ${accent} !important; }
        .markmap-node > foreignObject,
        .markmap-node > foreignObject > div,
        .markmap-node > foreignObject > div > * {
            visibility: visible !important;
            opacity: 1 !important;
            display: block !important;
        }
    `;
    document.head.appendChild(s);
}

// Captura o estado de fold atual antes de re-renderizar
function captureFoldState(node, map = new Map()) {
    if (!node) return map;
    map.set(node.content || node.data?.content || '', node.payload?.fold ?? 0);
    if (node.children) node.children.forEach(c => captureFoldState(c, map));
    return map;
}

// Restaura o estado de fold baseado no conteúdo do nó
function restoreFoldState(node, map) {
    if (!node) return;
    const key = node.content || node.data?.content || '';
    if (map.has(key)) {
        if (!node.payload) node.payload = {};
        node.payload.fold = map.get(key);
    }
    if (node.children) node.children.forEach(c => restoreFoldState(c, map));
}

async function render() {
    nodeCounter = 0;
    const raw = editorEl.value;
    const md = preprocessMarkdown(raw);
    const config = extractConfig(raw);
    applyTheme(config);

    let root, features;
    try {
        ({ root, features } = transformer.transform(md));
    } catch(e) { return; }

    // Salva o estado de fold ANTES de trocar currentRoot
    const prevFoldState = currentRoot ? captureFoldState(currentRoot) : null;

    currentRoot = root;
    linkParents(currentRoot);

    if (isFirstRender || !prevFoldState) {
        // Primeiro render: recolhe tudo (comportamento original)
        currentNavIndex = 0;
        currentFocusedNode = currentRoot;
        foldAll(currentRoot);
        isFirstRender = false;

        isAllExpanded = checkAllExpanded(currentRoot);
        updateExpandBtn();

        if (!mm) {
            mm = Markmap.create('#markmap', {
                autoFit: false,
                duration: 450,
                maxWidth: themeColors.maxWidth,
                spacingVertical: 10,
                spacingHorizontal: 64,
                paddingX: 14,
                zoom: true,
                pan: true,
                color: (node) => {
                    const content = node.data?.content || node.content || '';
                    return content.includes('(!!)') ? themeColors.accent : themeColors.link;
                }
            }, currentRoot);
            mm.fit();
        } else {
            mm.setOptions({
                maxWidth: themeColors.maxWidth,
                color: (node) => (node.data?.content || node.content || '').includes('(!!)') ? themeColors.accent : themeColors.link
            });
            mm.setData(currentRoot);
            mm.fit();
        }

        if (currentFocusedNode) {
            centerOnNode(currentFocusedNode);
            highlightNode(currentFocusedNode);
        }

    } else {
        // Re-render por edição: restaura o estado anterior SEM mover a câmera
        restoreFoldState(currentRoot, prevFoldState);

        isAllExpanded = checkAllExpanded(currentRoot);
        updateExpandBtn();

        // Preserva a transformação de zoom/pan atual antes de setData
        const svg = document.getElementById('markmap');
        const savedTransform = svg ? d3.zoomTransform(svg) : null;

        mm.setOptions({
            maxWidth: themeColors.maxWidth,
            color: (node) => (node.data?.content || node.content || '').includes('(!!)') ? themeColors.accent : themeColors.link
        });
        mm.setData(currentRoot);

        // Restaura a posição da câmera após setData
        if (savedTransform && svg && mm.zoom) {
            requestAnimationFrame(() => {
                d3.select(svg).call(mm.zoom.transform, savedTransform);
            });
        }
    }

    updateProgress();
    charCount.textContent = `${raw.length} chars`;
    setTimeout(forceRootVisible, 50);
    setTimeout(forceRootVisible, 500);
    setTimeout(injectSketchFilter, 80);   // caneta theme
    setTimeout(injectSketchFilter, 520);  // re-inject after animation
    setTimeout(applyHighlights, 100);     // (!!) destaque
    setTimeout(applyHighlights, 600);     // re-apply after animation
}

// ─── HIGHLIGHT (!!) ───────────────────────────────────────────────────────────
function applyHighlights() {
    const svg = document.getElementById('markmap');
    if (!svg) return;

    svg.querySelectorAll('g.markmap-node').forEach(g => {
        // Lê o texto visível renderizado no DOM — independe da estrutura interna do markmap
        const fo = g.querySelector('foreignObject div');
        if (!fo) return;

        const rawHTML = fo.innerHTML;
        if (rawHTML.includes('(!!)')) {
            g.classList.add('markmap-accent');
            // Remove o marcador (!!) do texto exibido
            fo.innerHTML = rawHTML.replace(/\s*\(!!\)\s*/g, ' ').trim();
        } else {
            g.classList.remove('markmap-accent');
        }
    });
}

// ─── SKETCH FILTER (tema: caneta) ────────────────────────────────────────────
function injectSketchFilter() {
    const svg = document.getElementById('markmap');
    if (!svg) return;

    if (!isPaperTheme) {
        // Remove filter se saiu do tema caneta
        svg.querySelectorAll('.markmap-link[filter]').forEach(el => el.removeAttribute('filter'));
        return;
    }

    // Garante que o elemento <defs> existe no SVG
    let defs = svg.querySelector('defs');
    if (!defs) {
        defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
        svg.insertBefore(defs, svg.firstChild);
    }

    // Injeta o filtro de esboço uma única vez
    if (!defs.querySelector('#sketch-filter')) {
        const filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
        filter.id = 'sketch-filter';
        filter.setAttribute('x', '-8%');
        filter.setAttribute('y', '-8%');
        filter.setAttribute('width', '116%');
        filter.setAttribute('height', '116%');
        // feTurbulence gera ruído fractal; feDisplacementMap aplica esse ruído
        // como deslocamento nos pixels — resultado: linhas com tremor natural de caneta
        filter.innerHTML =
            '<feTurbulence type="fractalNoise" baseFrequency="0.035 0.028" numOctaves="4" seed="12" result="noise"/>' +
            '<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.8" xChannelSelector="R" yChannelSelector="G"/>';
        defs.appendChild(filter);
    }

    // Aplica o filtro em todos os ramos do mapa
    svg.querySelectorAll('.markmap-link').forEach(el => {
        el.setAttribute('filter', 'url(#sketch-filter)');
    });
}

function forceRootVisible() {
    const svg = document.getElementById('markmap');
    if (!svg) return;
    svg.querySelectorAll('foreignObject').forEach(fo => {
        fo.style.removeProperty('visibility');
        fo.style.removeProperty('display');
        fo.setAttribute('visibility', 'visible');
        const div = fo.querySelector('div');
        if (div) { div.style.removeProperty('opacity'); div.style.removeProperty('display'); }
    });
}

function flatNodes(node, list = []) {
    list.push(node);
    if (node.children) node.children.forEach(c => flatNodes(c, list));
    return list;
}

function foldAll(root) {
    if (!root.children) return;
    root.children.forEach(child => foldAllRecursive(child));
}
function foldAllRecursive(node) {
    if (!node.payload) node.payload = {};
    if (node.children?.length > 0) {
        node.payload.fold = 1;
        node.children.forEach(foldAllRecursive);
    }
}

function expandAllRecursive(node) {
    if (!node.payload) node.payload = {};
    node.payload.fold = 0;
    if (node.children) node.children.forEach(expandAllRecursive);
}

function checkAllExpanded(node) {
    if (node.children?.length > 0) {
        if (node.payload?.fold) return false;
        return node.children.every(checkAllExpanded);
    }
    return true;
}

function expandAll() {
    if (!currentRoot || !mm) return;
    expandAllRecursive(currentRoot);
    isAllExpanded = true;
    updateExpandBtn();
    mm.setData(currentRoot);
    updateProgress();
    setTimeout(() => mm?.fit(), 150);
    setTimeout(applyHighlights, 600);
    toast('Mapa totalmente expandido');
}

function collapseAll() {
    if (!currentRoot || !mm) return;
    foldAll(currentRoot);
    isAllExpanded = false;
    updateExpandBtn();
    currentNavIndex = 0;
    currentFocusedNode = currentRoot;
    mm.setData(currentRoot);
    updateProgress();
    setTimeout(() => mm?.fit(), 150);
    setTimeout(applyHighlights, 600);
    toast('Mapa recolhido');
}

function toggleExpandAll() {
    if (isAllExpanded) collapseAll();
    else expandAll();
}

function updateExpandBtn() {
    const btn = document.getElementById('fab-expand');
    if (!btn) return;
    if (isAllExpanded) {
        btn.classList.add('active');
        btn.querySelector('.fab-tip').innerHTML = 'Recolher&nbsp;&nbsp;<kbd>A</kbd>';
        btn.title = 'Recolher tudo';
    } else {
        btn.classList.remove('active');
        btn.querySelector('.fab-tip').innerHTML = 'Expandir tudo&nbsp;&nbsp;<kbd>A</kbd>';
        btn.title = 'Expandir tudo';
    }
}

function updateProgress() {
    if (!currentRoot) return;
    const nodes = flatNodes(currentRoot);
    const branches = nodes.filter(n => n.children?.length > 0);
    if (!branches.length) return;
    const opened = branches.filter(n => !n.payload?.fold || n.payload.fold === 0).length;
    progressFill.style.width = `${(opened / branches.length) * 100}%`;
}

// ─── NODE NAVIGATION ──────────────────────────────────────────────────────────
function linkParents(node, parent = null) {
    node.parent = parent;
    node.id = ++nodeCounter;
    if (node.children) node.children.forEach(child => linkParents(child, node));
}

function centerOnNode(node) {
    if (!mm || !node) return;
    setTimeout(() => {
        try {
            const svg = document.getElementById('markmap');
            if (!svg) return;
            const zoom = mm.zoom;
            if (!zoom) return;
            const viewerRect = svg.getBoundingClientRect();
            const cx = viewerRect.width / 2;
            const cy = viewerRect.height / 2;
            const nodeGs = Array.from(svg.querySelectorAll('g.markmap-node'));
            let targetG = null;
            for (const g of nodeGs) {
                const d = g.__data__;
                if (d && (d.id === node.id || d.data?.id === node.id || d === node)) { targetG = g; break; }
            }
            if (!targetG) return;
            const nodeRect = targetG.getBoundingClientRect();
            const nodeCx = nodeRect.left + nodeRect.width / 2 - viewerRect.left;
            const nodeCy = nodeRect.top + nodeRect.height / 2 - viewerRect.top;
            const currentTransform = d3.zoomTransform(svg);
            const k = currentTransform.k;
            const dx = cx - nodeCx;
            const dy = cy - nodeCy;
            const newTransform = d3.zoomIdentity.translate(currentTransform.x + dx, currentTransform.y + dy).scale(k);
            d3.select(svg).transition().duration(700).ease(d3.easeCubicInOut).call(zoom.transform, newTransform);
        } catch(e) {}
    }, 150);
}

function stepForward() {
    if (!currentRoot) return;
    const all = flatNodes(currentRoot);
    if (currentNavIndex < all.length - 1) {
        currentNavIndex++;
        const next = all[currentNavIndex];
        let p = next.parent;
        let needed = false;
        while (p) {
            if (p.payload?.fold) { p.payload.fold = 0; needed = true; }
            p = p.parent;
        }
        if (needed) {
            mm.setData(currentRoot);
            updateProgress();
            setTimeout(() => { currentFocusedNode = next; centerOnNode(next); highlightNode(next); }, 150);
            setTimeout(applyHighlights, 600);
        } else {
            currentFocusedNode = next; centerOnNode(next); highlightNode(next);
        }
    }
}

function stepBackward() {
    if (!currentRoot) return;
    const all = flatNodes(currentRoot);
    if (currentNavIndex > 0) {
        currentNavIndex--;
        const prev = all[currentNavIndex];
        currentFocusedNode = prev;
        centerOnNode(prev);
        highlightNode(prev);
    }
}

function highlightNode(node) {
    const svg = document.getElementById('markmap');
    if (!svg) return;
    svg.querySelectorAll('.markmap-node.focused').forEach(el => el.classList.remove('focused'));
    svg.querySelectorAll('.markmap-node.focused-ancestor').forEach(el => el.classList.remove('focused-ancestor'));
    if (!node) return;
    const nodeGs = Array.from(svg.querySelectorAll('g.markmap-node'));
    let targetG = null;
    for (const g of nodeGs) {
        const d = g.__data__;
        if (d && (d.id === node.id || d.data?.id === node.id || d === node)) { targetG = g; break; }
    }
    if (targetG) {
        targetG.classList.add('focused');
        let parent = node.parent;
        while (parent) {
            for (const g of nodeGs) {
                const d = g.__data__;
                if (d && (d.id === parent.id || d.data?.id === parent.id || d === parent)) { g.classList.add('focused-ancestor'); break; }
            }
            parent = parent.parent;
        }
    }
}

// ─── UI ACTIONS ───────────────────────────────────────────────────────────────
function applyEditorVisibility() {
    panelEl.classList.toggle('hidden-ui', !editorVisible);
    fabEditor.classList.toggle('active', editorVisible);
    setTimeout(() => mm?.fit(), 380);
}

function toggleEditor() {
    editorVisible = !editorVisible;
    applyEditorVisibility();
    saveState();
}

function resetZoom() { mm?.fit(); }

function enterFocusMode() {
    focusMode = true;
    topbarEl.classList.add('hidden-ui');
    panelEl.classList.add('hidden-ui');
    fabsEl.classList.add('hidden-ui');
    fabEditor.classList.remove('active');
    focusHint.classList.add('visible');
    setTimeout(() => mm?.fit(), 380);
    toast('Modo foco — pressione Esc para sair');
}

function exitFocusMode() {
    focusMode = false;
    topbarEl.classList.remove('hidden-ui');
    fabsEl.classList.remove('hidden-ui');
    focusHint.classList.remove('visible');
    if (editorVisible) {
        panelEl.classList.remove('hidden-ui');
        fabEditor.classList.add('active');
    }
    setTimeout(() => mm?.fit(), 380);
}

async function exportImage() {
    toast('Exportando…');
    try {
        const node = document.getElementById('viewer');
        const dataUrl = await htmlToImage.toPng(node, { quality: 1, pixelRatio: 2 });
        const a = document.createElement('a');
        const m = maps.find(m => m.id === activeId);
        a.download = `${m?.name || 'mapa'}.png`;
        a.href = dataUrl; a.click();
        toast('✓ Imagem exportada');
    } catch(e) { toast('⚠ Erro ao exportar: ' + e.message); }
}

function downloadMD() {
    const m = maps.find(m => m.id === activeId);
    const blob = new Blob([editorEl.value], { type: 'text/markdown' });
    const a = document.createElement('a');
    a.download = `${m?.name || 'mapa'}.md`;
    a.href = URL.createObjectURL(blob); a.click();
    toast('✓ .md salvo');
}

// ─── BACKUP / IMPORT ──────────────────────────────────────────────────────────
function exportBackup() {
    // Garante que o mapa ativo está atualizado antes de exportar
    const cur = maps.find(m => m.id === activeId);
    if (cur) cur.content = editorEl.value;

    const now = new Date();
    const dateStr = now.toISOString().slice(0, 10);
    const timeStr = now.toTimeString().slice(0, 5).replace(':', 'h');

    const payload = {
        _version: 1,
        _app: 'markmap',
        _exported: now.toISOString(),
        _count: maps.length,
        maps,
        activeId,
    };

    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.download = `markmap-backup-${dateStr}-${timeStr}.json`;
    a.href = URL.createObjectURL(blob);
    a.click();
    URL.revokeObjectURL(a.href);
    toast(`✓ Backup de ${maps.length} mapa${maps.length !== 1 ? 's' : ''} exportado`);
}

function triggerImport() {
    document.getElementById('import-input').value = '';   // permite re-selecionar o mesmo arquivo
    document.getElementById('import-input').click();
}

function importBackup(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = e => {
        let payload;
        try {
            payload = JSON.parse(e.target.result);
        } catch {
            toast('⚠ Arquivo inválido — não é um JSON');
            return;
        }

        // Validação básica da estrutura
        if (!payload?.maps || !Array.isArray(payload.maps) || payload.maps.length === 0) {
            toast('⚠ Backup inválido ou vazio');
            return;
        }

        const incoming = payload.maps;
        const dateInfo = payload._exported
            ? ` (exportado em ${new Date(payload._exported).toLocaleDateString('pt-BR')})`
            : '';

        const choice = window.confirm(
            `Backup encontrado: ${incoming.length} mapa${incoming.length !== 1 ? 's' : ''}${dateInfo}.\n\n` +
            `• OK → Adicionar ao lado dos mapas atuais\n` +
            `• Cancelar → Substituir TODOS os mapas atuais\n\n` +
            `Você tem ${maps.length} mapa${maps.length !== 1 ? 's' : ''} atualmente.`
        );

        // Salva o mapa ativo antes de qualquer mudança
        const cur = maps.find(m => m.id === activeId);
        if (cur) cur.content = editorEl.value;

        if (choice) {
            // MERGE — adiciona, evita IDs duplicados regenerando
            const imported = incoming.map(m => ({ ...m, id: uid() }));
            maps = [...maps, ...imported];
            toast(`✓ ${imported.length} mapa${imported.length !== 1 ? 's' : ''} adicionado${imported.length !== 1 ? 's' : ''}`);
        } else {
            // REPLACE — substitui tudo
            maps = incoming.map(m => ({ ...m, id: uid() }));
            activeId = maps[0].id;
            editorEl.value = maps[0].content;
            isFirstRender = true;
            toast(`✓ ${maps.length} mapa${maps.length !== 1 ? 's' : ''} restaurado${maps.length !== 1 ? 's' : ''}`);
        }

        renderTabs();
        saveState();
        scheduleRender();
    };

    reader.readAsText(file);
}

function toast(msg, duration = 2200) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), duration);
}


// ─── EVENTS ───────────────────────────────────────────────────────────────────
editorEl.addEventListener('input', () => {
    const cur = maps.find(m => m.id === activeId);
    if (cur) cur.content = editorEl.value;
    charCount.textContent = `${editorEl.value.length} chars`;
    scheduleRender();
    saveState();
});

window.addEventListener('keydown', e => {
    if (document.activeElement === editorEl) return;
    if (e.key === 'Escape') {
        if (laserMode) { toggleLaser(); return; }
        if (focusMode) exitFocusMode();
        return;
    }
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); stepForward(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); stepBackward(); }
    else if (e.key.toLowerCase() === 'e') toggleEditor();
    else if (e.key.toLowerCase() === 'f') resetZoom();
    else if (e.key.toLowerCase() === 'a') { e.preventDefault(); toggleExpandAll(); }
    else if (e.key.toLowerCase() === 'l') { e.preventDefault(); toggleLaser(); }
    else if (e.ctrlKey && e.key.toLowerCase() === 't') { e.preventDefault(); newMap(); }
});

window.addEventListener('mousemove', e => {
    laserPos = { x: e.clientX, y: e.clientY };
    if (!laserMode) return;
    laserTrail.push({ x: e.clientX, y: e.clientY });
    if (laserTrail.length > TRAIL_LEN) laserTrail.shift();
});

window.addEventListener('resize', () => {
    mm?.fit();
    if (laserMode) {
        laserCanvas.width  = window.innerWidth;
        laserCanvas.height = window.innerHeight;
    }
});

// ─── LASER POINTER ────────────────────────────────────────────────────────────
function toggleLaser() {
    laserMode = !laserMode;
    const btn = document.getElementById('fab-laser');

    if (laserMode) {
        laserCanvas.width  = window.innerWidth;
        laserCanvas.height = window.innerHeight;
        laserCanvas.classList.add('active');
        document.body.classList.add('laser-mode');
        if (btn) btn.classList.add('laser-on');
        laserTrail = [];
        laserRaf = requestAnimationFrame(drawLaser);
        toast('Laser ligado — L ou Esc para desligar');
    } else {
        laserCanvas.classList.remove('active');
        document.body.classList.remove('laser-mode');
        if (btn) btn.classList.remove('laser-on');
        cancelAnimationFrame(laserRaf);
        laserCtx.clearRect(0, 0, laserCanvas.width, laserCanvas.height);
        laserTrail = [];
        toast('Laser desligado');
    }
}

function drawLaser() {
    if (!laserMode) return;

    const W = laserCanvas.width;
    const H = laserCanvas.height;
    laserCtx.clearRect(0, 0, W, H);

    const trailLen = laserTrail.length;

    // ── Rastro ──
    for (let i = 0; i < trailLen; i++) {
        const t     = i / (trailLen - 1 || 1);   // 0 = mais antigo, 1 = mais novo
        const alpha = t * t * 0.55;               // fade quadrático
        const r     = 2 + (1 - t) * 10;          // raio encolhe no ponto atual
        const pt    = laserTrail[i];

        const grad = laserCtx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, r * 2.5);
        grad.addColorStop(0, `rgba(255, 80, 60, ${alpha})`);
        grad.addColorStop(1, `rgba(255, 40, 20, 0)`);

        laserCtx.beginPath();
        laserCtx.arc(pt.x, pt.y, r * 2.5, 0, Math.PI * 2);
        laserCtx.fillStyle = grad;
        laserCtx.fill();
    }

    // ── Ponto principal ──
    const { x, y } = laserPos;

    // Halo externo grande (difuso)
    const outerGrad = laserCtx.createRadialGradient(x, y, 0, x, y, 38);
    outerGrad.addColorStop(0,   'rgba(255, 80, 60, 0.28)');
    outerGrad.addColorStop(0.4, 'rgba(255, 50, 30, 0.14)');
    outerGrad.addColorStop(1,   'rgba(255, 30, 10, 0)');
    laserCtx.beginPath();
    laserCtx.arc(x, y, 38, 0, Math.PI * 2);
    laserCtx.fillStyle = outerGrad;
    laserCtx.fill();

    // Halo interno (brilhante)
    const innerGrad = laserCtx.createRadialGradient(x, y, 0, x, y, 13);
    innerGrad.addColorStop(0,   'rgba(255, 180, 160, 0.95)');
    innerGrad.addColorStop(0.4, 'rgba(255, 80,  50, 0.75)');
    innerGrad.addColorStop(1,   'rgba(255, 40,  10, 0)');
    laserCtx.beginPath();
    laserCtx.arc(x, y, 13, 0, Math.PI * 2);
    laserCtx.fillStyle = innerGrad;
    laserCtx.fill();

    // Núcleo branco central
    const coreGrad = laserCtx.createRadialGradient(x, y, 0, x, y, 3.5);
    coreGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
    coreGrad.addColorStop(1, 'rgba(255, 200, 180, 0)');
    laserCtx.beginPath();
    laserCtx.arc(x, y, 3.5, 0, Math.PI * 2);
    laserCtx.fillStyle = coreGrad;
    laserCtx.fill();

    laserRaf = requestAnimationFrame(drawLaser);
}

// ─── BOOT ─────────────────────────────────────────────────────────────────────
init();

// ─── SERVICE WORKER ───────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
}
</script>
